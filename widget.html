<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <title>Hipe Widget</title>
  <link rel="icon" type="image/png" href="assets/favicon.png">
  <link rel="apple-touch-icon" href="assets/favicon.png">
  <link
    href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Barlow+Condensed:wght@500;600;700&display=swap"
    rel="stylesheet">
  <script src="https://code.iconify.design/iconify-icon/1.0.8/iconify-icon.min.js"></script>
  <style>
    /* ========== ESTILOS BASE (igual que antes) ========== */
    *,
    *::before,
    *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --bg: #111117;
      --border: #22222e;
      --accent: #7c3aed;
      --accent-rgb: 124, 58, 237;
      --text: #ffffff;
      --muted: #aaaaaa;
      --radius: 4px;
      --goal-grad-1: #7c3aed;
      --goal-grad-2: #9d5ff5;
      --goal-grad-3: #5a1fc8;
      --social-soft: rgba(124, 58, 237, .24);
      --social-soft-2: rgba(124, 58, 237, .10);
    }

    html,
    body {
      background: transparent;
      overflow: hidden;
    }

    body {
      font-family: 'Rajdhani', sans-serif;
    }

    #widget {
      opacity: 0;
      transition: opacity .5s ease;
      filter: drop-shadow(0 0 12px rgba(0, 0, 0, .35)) drop-shadow(0 0 4px rgba(0, 0, 0, .6));
    }

    #widget.ready {
      opacity: 1;
    }

    #widget.layout-compacto {
      display: flex;
      flex-direction: column;
      padding: 8px;
      gap: 8px;
    }

    #row-top {
      display: flex;
      height: 100px;
      flex-shrink: 0;
    }

    #row-bottom {
      display: flex;
      height: 80px;
      flex-shrink: 0;
    }

    #widget.layout-completo {
      display: flex;
      flex-direction: row;
      padding: 8px;
      gap: 10px;
      align-items: stretch;
    }

    #widget.layout-completo #row-top,
    #widget.layout-completo #row-bottom {
      display: contents;
    }

    .sec {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      display: flex;
      align-items: center;
      overflow: hidden;
      flex-shrink: 0;
      position: relative;
    }

    /* Branding */
    #sec-id {
      width: 300px;
      padding: 0 16px;
      gap: 10px;
    }

    #widget.layout-completo #sec-id {
      height: 100px;
    }

    #id-avatar {
      width: 68px;
      height: 68px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid var(--border);
      flex-shrink: 0;
    }

    #id-info {
      display: flex;
      flex-direction: column;
      gap: 3px;
      min-width: 0;
    }

    #id-name {
      font-size: 22px;
      font-weight: 700;
      color: var(--text);
      text-transform: uppercase;
      letter-spacing: .05em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      line-height: 1;
    }

    #id-status {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 14px;
      font-weight: 600;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: .08em;
    }

    #live-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #2e2e3a;
      flex-shrink: 0;
      transition: background .4s;
    }

    #live-dot.live {
      background: #ff2d2d;
      animation: pdot 1.4s ease-in-out infinite;
    }

    @keyframes pdot {

      0%,
      100% {
        box-shadow: 0 0 0 0 rgba(255, 45, 45, .6);
      }

      50% {
        box-shadow: 0 0 0 5px rgba(255, 45, 45, 0);
      }
    }

    /* Metas */
    #sec-goal {
      padding: 0 20px;
      position: relative;
      justify-content: center;
      flex-shrink: 0;
    }

    #widget.layout-completo #sec-goal {
      height: 100px;
      padding: 0 16px;
    }

    .gst {
      position: absolute;
      left: 20px;
      right: 20px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      opacity: 0;
      transform: translateY(-4px);
      transition: opacity .35s, transform .35s;
      pointer-events: none;
    }

    #widget.layout-completo .gst {
      left: 16px;
      right: 16px;
      gap: 4px;
    }

    .gst.on {
      opacity: 1;
      transform: translateY(0px);
      pointer-events: auto;
    }

    #gst-cel.on {
      z-index: 10;
    }

    #sec-goal.celebrating-goal .gst:not(#gst-cel) {
      opacity: 0 !important;
      pointer-events: none !important;
    }

    #sec-goal.celebrating-goal #gst-cel {
      opacity: 1 !important;
      z-index: 20;
    }

    #gst-hdr {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      min-width: 0;
      overflow: hidden;
    }

    /* Títulos de metas: acento suave y espacio suficiente para META FOLLOWS */
    #gst-lbl,
    #gst-lbl-bits,
    #gst-lbl-follows {
      flex: 1 1 46%;
      min-width: 0;
      max-width: 46%;
      font-size: 18px;
      font-weight: 800;
      color: var(--accent);
      text-transform: uppercase;
      letter-spacing: .07em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      text-shadow: 0 0 5px rgba(var(--accent-rgb), .16);
    }

    #widget.layout-completo #gst-lbl,
    #widget.layout-completo #gst-lbl-bits,
    #widget.layout-completo #gst-lbl-follows {
      flex-basis: 44%;
      max-width: 44%;
      font-size: 15px;
      letter-spacing: .06em;
    }

    /* Contenedor de icono + número */
    #gst-cnt,
    #gst-cnt-bits,
    #gst-cnt-follows {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 8px;
      flex: 0 1 54%;
      min-width: 0;
      max-width: 54%;
      font-size: 56px;
      font-weight: 700;
      color: var(--text);
      line-height: 1;
      white-space: nowrap;
      overflow: hidden;
    }

    #widget.layout-completo #gst-cnt,
    #widget.layout-completo #gst-cnt-bits,
    #widget.layout-completo #gst-cnt-follows {
      font-size: 38px;
      gap: 6px;
      flex-basis: 56%;
      max-width: 56%;
    }

    #gst-txt,
    #gst-bits-txt,
    #gst-follows-txt {
      display: inline-block;
      min-width: 0;
      white-space: nowrap;
      line-height: 1;
    }

    #gst-heart,
    #gst-bits-gif,
    #gst-follows-gif {
      height: 60px;
      max-width: 60px;
      object-fit: contain;
      flex-shrink: 0;
    }

    #widget.layout-completo #gst-heart,
    #widget.layout-completo #gst-bits-gif,
    #widget.layout-completo #gst-follows-gif {
      height: 60px;
      max-width: 60px;
    }

    #gst-track,
    #gst-track-bits,
    #gst-track-follows {
      height: 8px;
      margin-top: 3px;
      background: rgba(255, 255, 255, .07);
      border-radius: 4px;
      overflow: hidden;
      box-shadow: inset 0 1px 3px rgba(0, 0, 0, .4);
    }

    #widget.layout-completo #gst-track,
    #widget.layout-completo #gst-track-bits,
    #widget.layout-completo #gst-track-follows {
      height: 6px;
    }

    #gst-fill,
    #gst-bits-fill,
    #gst-follows-fill {
      height: 100%;
      background: linear-gradient(90deg,
          var(--goal-grad-3) 0%,
          var(--goal-grad-1) 30%,
          var(--goal-grad-2) 50%,
          var(--goal-grad-1) 70%,
          var(--goal-grad-3) 100%);
      border-radius: 4px;
      box-shadow: 0 0 6px rgba(var(--accent-rgb), 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.2);
      transition: width .8s cubic-bezier(.4, 0, .2, 1);
      width: 0%;
      position: relative;
    }

    #gst-fill::after,
    #gst-bits-fill::after,
    #gst-follows-fill::after {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 40%;
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.2), transparent);
      border-radius: 4px 4px 0 0;
      pointer-events: none;
    }

    #gst-fill::before,
    #gst-bits-fill::before,
    #gst-follows-fill::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.25) 0%, rgba(255, 255, 255, 0) 40%, rgba(255, 255, 255, 0) 60%, rgba(255, 255, 255, 0.15) 100%);
      border-radius: 4px;
      pointer-events: none;
    }

    .bits-caption {
      font-size: 17px;
      font-weight: 700;
      color: var(--muted);
      text-align: center;
      margin-top: 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      line-height: 1;
      opacity: .9;
    }

    #gst-bits,
    #gst-bits.on {
      transform: translateY(0px);
    }

    /* Solo META BITS en modo compacto:
   baja icono/número, pero sube el texto inferior */
    #widget.layout-compacto #gst-bits #gst-hdr {
      transform: translateY(5px);
    }

    #widget.layout-compacto #gst-track-bits {
      margin-top: 6px;
    }

    #widget.layout-compacto .bits-caption {
      transform: translateY(-3px);
    }

    #widget.layout-completo .bits-caption {
      font-size: 12px;
      margin-top: 1px;
      transform: none;
    }

    #widget.layout-completo #gst-bits,
    #widget.layout-completo #gst-bits.on {
      transform: translateY(0px);
    }

    #widget.layout-completo #gst-bits #gst-hdr,
    #widget.layout-completo #gst-track-bits {
      transform: none;
    }

    #gst-cel {
      align-items: center;
      justify-content: center;
      gap: 7px;
      text-align: center;
      z-index: 5;
    }

    #cel-txt {
      font-size: 34px;
      font-weight: 900;
      color: #ffd700;
      text-transform: uppercase;
      letter-spacing: .05em;
      text-align: center;
      line-height: .95;
      max-width: 100%;
      white-space: nowrap;
      text-shadow:
        0 0 8px rgba(255, 215, 0, .55),
        0 0 18px rgba(255, 215, 0, .28);
      animation: cglow 1s ease-in-out infinite alternate;
    }

    #widget.layout-completo #cel-txt {
      font-size: 26px;
      letter-spacing: .04em;
    }

    #cel-usr {
      font-size: 28px;
      font-weight: 800;
      color: var(--text);
      text-align: center;
      line-height: 1;
      max-width: 100%;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      opacity: .95;
      text-shadow: 0 0 8px rgba(255, 255, 255, .16);
    }

    #widget.layout-completo #cel-usr {
      font-size: 22px;
    }

    @keyframes cglow {
      from {
        text-shadow: 0 0 8px rgba(255, 215, 0, .4);
      }

      to {
        text-shadow: 0 0 20px rgba(255, 215, 0, .9), 0 0 40px rgba(255, 215, 0, .3);
      }
    }

    /* Sponsors */
    #sec-sponsor {
      position: relative;
      justify-content: center;
      padding-bottom: 18px;
      flex-shrink: 0;
    }

    #widget.layout-completo #sec-sponsor {
      height: 100px;
    }

    .sp-slide {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transition: opacity .45s ease;
      pointer-events: none;
      padding-bottom: 12px;
    }

    .sp-slide.on {
      opacity: 1;
      pointer-events: auto;
    }

    #sp-uptime {
      justify-content: center;
      align-items: center;
      text-align: center;
    }

    #sp-ut-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
    }

    #sp-utlbl {
      font-size: 16px;
      font-weight: 700;
      color: var(--accent);
      text-shadow: 0 0 4px rgba(var(--accent-rgb), 0.4);
      text-transform: uppercase;
      letter-spacing: .09em;
      line-height: 1;
    }

    #sp-utval {
      font-size: 44px;
      font-weight: 700;
      color: var(--text);
      line-height: 1;
      letter-spacing: .03em;
    }

    #sp-category {
      justify-content: center;
      align-items: center;
      padding: 14px 14px 16px;
    }

    #sp-cat-wrap {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 18px;
      width: 100%;
      min-width: 0;
    }

    #sp-cat-img {
      width: 58px;
      height: 76px;
      object-fit: cover;
      border-radius: 5px;
      box-shadow: 0 0 0 1px rgba(var(--accent-rgb), .45), 0 8px 22px rgba(0, 0, 0, .35);
      flex-shrink: 0;
    }

    #sp-cat-info {
      flex: 0 1 auto;
      min-width: 0;
      max-width: 280px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      text-align: center;
    }

    #sp-cat-lbl {
      font-size: 17px;
      font-weight: 900;
      color: var(--accent);
      letter-spacing: .10em;
      text-transform: uppercase;
      line-height: 1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 100%;
    }

    #sp-cat-name {
      font-size: 40px;
      font-weight: 800;
      color: var(--text);
      line-height: .88;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 280px;
      min-width: 0;
      text-align: center;
    }

    #widget.layout-completo #sp-cat-img {
      width: 44px;
      height: 60px;
    }

    #widget.layout-completo #sp-cat-info {
      max-width: 220px;
    }

    #widget.layout-completo #sp-cat-name {
      font-size: 26px;
      max-width: 220px;
      min-width: 0;
    }

    #widget.layout-completo #sp-cat-lbl {
      font-size: 13px;
    }

    #sp-weather {
      justify-content: center;
      align-items: center;
      padding: 0 20px;
    }

    #sp-weather-wrap {
      width: 100%;
      height: 100%;
      min-width: 0;
      display: grid;
      grid-template-columns: 94px 120px minmax(0, .72fr);
      align-items: center;
      gap: 10px;
    }

    #sp-weather-details {
      min-width: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: flex-start;
      gap: 6px;
      padding-left: 2px;
      opacity: .98;
    }

    .weather-detail {
      display: grid;
      grid-template-columns: 50px minmax(0, 1fr);
      align-items: center;
      gap: 7px;
      min-width: 0;
      font-family: 'Barlow Condensed', 'Rajdhani', sans-serif;
      line-height: 1;
      white-space: nowrap;
    }

    .weather-detail-meta {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      min-width: 0;
    }

    .weather-detail-meta iconify-icon {
      color: #ffffff;
      font-size: 12px;
      filter: drop-shadow(0 0 6px rgba(255,255,255,.18));
      flex-shrink: 0;
    }

    .weather-detail span {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 30px;
      min-width: 30px;
      min-height: 15px;
      padding: 2px 0 1px;
      border-radius: 4px;
      border: 1px solid rgba(var(--accent-rgb), .40);
      background: rgba(var(--accent-rgb), .16);
      color: #fff;
      font-size: 9px;
      font-weight: 900;
      letter-spacing: .08em;
      text-transform: uppercase;
      box-shadow: 0 1px 5px rgba(var(--accent-rgb), .10);
      text-shadow: none;
      text-align: center;
      flex-shrink: 0;
    }

    .weather-detail strong {
      color: rgba(255,255,255,.90);
      font-size: 16px;
      font-weight: 800;
      letter-spacing: .01em;
      font-variant-numeric: tabular-nums;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    #sp-weather-info {
      width: 120px;
      min-width: 0;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 6px;
      text-align: center;
      padding-right: 0;
      transform: translateY(0);
    }

    #sp-weather-city {
      width: fit-content;
      max-width: 100%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 18px;
      font-size: 10px;
      font-weight: 900;
      color: #fff;
      background: rgba(var(--accent-rgb), 0.34);
      border: 1px solid rgba(var(--accent-rgb), 0.52);
      padding: 3px 9px 2px;
      border-radius: 4px;
      letter-spacing: .12em;
      text-transform: uppercase;
      line-height: 1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      box-shadow: 0 2px 7px rgba(var(--accent-rgb), .18);
      align-self: center;
      margin-bottom: 1px;
    }

    #sp-weather-temp {
      font-size: 58px;
      font-weight: 900;
      color: var(--text);
      line-height: .78;
      letter-spacing: -0.02em;
      white-space: nowrap;
      text-shadow: 0 2px 8px rgba(0,0,0,.38);
      margin-top: 1px;
      font-variant-numeric: tabular-nums;
    }

    #sp-weather-desc {
      position: relative;
      max-width: 120px;
      padding-left: 13px;
      font-size: 14px;
      font-weight: 900;
      color: var(--muted);
      letter-spacing: .075em;
      text-transform: uppercase;
      line-height: 1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-top: 0;
      align-self: center;
    }

    #sp-weather-desc::before {
      content: '';
      position: absolute;
      left: 0;
      top: 50%;
      width: 5px;
      height: 5px;
      transform: translateY(-50%);
      background: var(--accent);
      border-radius: 50%;
      box-shadow: 0 0 7px var(--accent);
    }

    @keyframes floatWeather {
      0%, 100% { transform: translateY(-1px); }
      50% { transform: translateY(-6px); }
    }

    @keyframes pulseSun {
      0%, 100% { box-shadow: 0 0 22px rgba(255, 190, 70, .50); }
      50% { box-shadow: 0 0 38px rgba(255, 190, 70, .80); }
    }

    @keyframes rainDrift {
      0%, 100% { transform: translateY(0) rotate(14deg); opacity: .85; }
      50% { transform: translateY(4px) rotate(14deg); opacity: 1; }
    }

    @keyframes floatCloud {
      0%, 100% { transform: translateX(0); }
      50% { transform: translateX(4px); }
    }

    @keyframes fallRain {
      0% { transform: translate(0, -5px) rotate(14deg); opacity: 0; }
      20% { opacity: 1; }
      80% { opacity: 1; }
      100% { transform: translate(-10px, 18px) rotate(14deg); opacity: 0; }
    }

    @keyframes flashBolt {
      0%, 100% { opacity: 1; filter: drop-shadow(0 0 8px rgba(255,217,74,.6)); }
      45% { opacity: 1; }
      50% { opacity: .12; filter: none; }
      55% { opacity: 1; filter: drop-shadow(0 0 24px rgba(255,217,74,1)); }
      60% { opacity: .12; filter: none; }
      65% { opacity: 1; }
    }

    .weather-visual {
      position: relative;
      width: 98px;
      height: 70px;
      justify-self: start;
      align-self: center;
      flex-shrink: 0;
      margin-left: 2px;
      transform: translateY(-1px);
      animation: floatWeather 4.5s ease-in-out infinite;
    }

    .weather-sun {
      position: absolute;
      width: 44px;
      height: 44px;
      right: 7px;
      top: 1px;
      border-radius: 50%;
      background: radial-gradient(circle at 34% 30%, #fff6a8 0%, #ffd45b 42%, #ff9a2e 74%, #ff6a1f 100%);
      box-shadow: 0 0 22px rgba(255, 190, 70, .50);
      animation: pulseSun 3s ease-in-out infinite;
    }

    .weather-cloud {
      position: absolute;
      width: 76px;
      height: 32px;
      right: 8px;
      bottom: 10px;
      border-radius: 999px;
      background: linear-gradient(180deg, rgba(255,255,255,.98), rgba(218,226,242,.94));
      filter: drop-shadow(0 6px 9px rgba(0,0,0,.28));
      z-index: 2;
      animation: floatCloud 7s ease-in-out infinite;
    }

    .weather-cloud::before,
    .weather-cloud::after {
      content: '';
      position: absolute;
      border-radius: 50%;
      background: inherit;
    }

    .weather-cloud::before {
      width: 38px;
      height: 38px;
      left: 10px;
      top: -18px;
    }

    .weather-cloud::after {
      width: 44px;
      height: 44px;
      right: 8px;
      top: -23px;
    }

    .weather-rain {
      position: absolute;
      right: 28px;
      bottom: 0px;
      display: none;
      gap: 10px;
      z-index: 3;
    }

    .weather-rain i {
      width: 4px;
      height: 16px;
      border-radius: 999px;
      background: #54d8ff;
      transform: rotate(14deg);
      box-shadow: 0 0 8px rgba(84,216,255,.45);
      animation: fallRain .9s linear infinite;
    }

    .weather-rain i:nth-child(2) { animation-delay: .3s; }
    .weather-rain i:nth-child(3) { animation-delay: .6s; }

    .weather-bolt {
      position: absolute;
      right: 34px;
      bottom: -2px;
      display: none;
      width: 22px;
      height: 30px;
      background: #ffd94a;

  <script>
    // ================== FASES ==================
    const FASES = {
      sponsor_social: { bodyW: 1200, bodyH: 204, gapH: 12, id: 300, goal: 470, sponsor: 390, ticker: 872, social: 300, hasSponsor: true, hasSocial: true },
      sponsor_nosocial: { bodyW: 1200, bodyH: 204, gapH: 12, id: 300, goal: 470, sponsor: 390, ticker: 1184, social: 0, hasSponsor: true, hasSocial: false },
      nosponsor_social: { bodyW: 800, bodyH: 204, gapH: 14, id: 300, goal: 470, sponsor: 0, ticker: 470, social: 300, hasSponsor: false, hasSocial: true },
      nosponsor_nosocial: { bodyW: 800, bodyH: 204, gapH: 14, id: 300, goal: 470, sponsor: 0, ticker: 784, social: 0, hasSponsor: false, hasSocial: false },
      completo: { bodyW: 1920, bodyH: 116, gapH: 10, id: 300, goal: 370, sponsor: 300, ticker: 594, social: 300, hasSponsor: true, hasSocial: true }
    };

    // ========== LEER CONFIGURACIÓN ==========
    let CFG = {};
    const urlParams = new URLSearchParams(window.location.search);
    const configParam = urlParams.get('config');
    if (configParam) {
      try {
        const decoded = atob(configParam);
        const json = decodeURIComponent(escape(decoded));
        CFG = JSON.parse(json);
      } catch (e) { console.warn('Error al leer la configuración de la URL', e); }
    }

    // ========== VALORES POR DEFECTO ==========
    const logoPath = CFG.logoPath || 'assets/logo.png';
    const goalGifPath = CFG.goalGifPath || 'assets/corazon.gif';
    const goalSubsActive = CFG.goalSubsActive !== false;
    const enableSounds = CFG.enableSounds === undefined ? true : CFG.enableSounds === true;
    const enableGoalSound = CFG.enableGoalSound === undefined ? true : CFG.enableGoalSound === true;
    const notificationVolume = (CFG.notificationVolume !== undefined ? CFG.notificationVolume : 80) / 100;
    const defaultEvents = {
      showSubs: true, showReSubs: true, showGiftSubs: true, showGiftBombs: true,
      showRaids: true, showCheers: true, showFollows: true, showRedemptions: true,
      showYTSubscribers: true, showYTMembers: true, showYTGifts: true, showSuperChat: true, showDonations: true
    };
    const eventsFromCfg = CFG.events || {};
    const events = { ...defaultEvents, ...eventsFromCfg };
    const defaultSoundEvents = {
      soundSubs: true, soundReSubs: true, soundGiftSubs: true, soundGiftBombs: true,
      soundRaids: true, soundCheers: true, soundFollows: true, soundRedemptions: true,
      soundYTSubscribers: true, soundYTMembers: true, soundYTGifts: true, soundSuperChat: true, soundDonations: true
    };
    const soundEventsFromCfg = CFG.soundEvents || {};
    const soundEvents = { ...defaultSoundEvents, ...soundEventsFromCfg };

    // Meta de bits
    const goalBits = CFG.goalBits || { active: false };
    const bitsActive = goalBits.active === true;
    const bitsPeriod = goalBits.period || 'stream';
    const bitsTarget = goalBits.target || 0;
    const bitsGif = goalBits.gif || 'assets/bits.gif';
    const bitsCaption = goalBits.caption || '';
    const bitsCurrentFromCfg = goalBits.current || 0;

    const goalFollows = CFG.goalFollows || { active: false };
    const followsActive = goalFollows.active === true;
    const followsGif = goalFollows.gif || 'assets/follow.gif';

    // Variables globales para bits
    let currentBits = bitsCurrentFromCfg;
    let ws = null;

    CFG.logoPath = logoPath;
    CFG.goalGifPath = goalGifPath;
    CFG.events = events;
    CFG.soundEvents = soundEvents;
    CFG.enableSounds = enableSounds;
    CFG.enableGoalSound = enableGoalSound;
    CFG.notificationVolume = notificationVolume * 100;

    if (CFG.creatorCode && !CFG.creatorCode.logo) CFG.creatorCode.logo = 'assets/codigo.png';
    else if (CFG.creatorCode === undefined && CFG.showCreatorCode === true) {
      CFG.creatorCode = { active: true, label: "CÓDIGO DE CREADOR", value: "CÓDIGО", logo: "assets/codigo.png" };
    }

    const T = CFG.theme || {};
    const R = document.documentElement;

    // ========== SONIDOS ==========
    const soundMap = {
      'sub': 'soundSubs', 'resub': 'soundReSubs', 'giftsub': 'soundGiftSubs', 'giftbomb': 'soundGiftBombs',
      'raid': 'soundRaids', 'bits': 'soundCheers', 'follow': 'soundFollows', 'redeem': 'soundRedemptions',
      'ytsub': 'soundYTSubscribers', 'member': 'soundYTMembers', 'ytgift': 'soundYTGifts', 'super': 'soundSuperChat', 'donate': 'soundDonations'
    };
    function playNotificationSound(eventType) {
      if (!enableSounds || !showTicker) return;
      const soundKey = soundMap[eventType];
      if (!soundKey) return;
      const allowed = soundEvents[soundKey] === undefined ? true : soundEvents[soundKey];
      if (!allowed) return;
      const audio = document.getElementById('notification-sound');
      if (!audio) return;
      if (audio.readyState < 2) { setTimeout(() => playNotificationSound(eventType), 200); return; }
      try { audio.pause(); audio.currentTime = 0; audio.play().catch(e => console.warn(e)); } catch (e) { console.warn(e); }
    }
    const audioElem = document.getElementById('notification-sound');
    if (audioElem) audioElem.volume = notificationVolume;
    const goalAudioElem = document.getElementById('goal-sound');
    if (goalAudioElem) goalAudioElem.volume = notificationVolume;

    function normalizeLayout(raw) { return (raw === 'horizontal' || raw === 'completo') ? 'completo' : 'compacto'; }
    const layoutMode = normalizeLayout(CFG.layout);
    const isCompacto = layoutMode === 'compacto';
    const isCompleto = layoutMode === 'completo';

    function hexToRgb(hex) {
      const h = (hex || '').replace('#', '').trim();
      if (h.length !== 6) return '124,58,237';
      const n = parseInt(h, 16);
      return `${(n >> 16) & 255},${(n >> 8) & 255},${n & 255}`;
    }

    // ===== APLICAR COLORES Y OPACIDAD =====
    const bgColor = T.bgColor || '#111117';
    const borderColor = T.borderColor || '#22222e';
    const bgOpacity = (T.bgOpacity !== undefined ? T.bgOpacity : 1);
    const borderOpacity = (T.borderOpacity !== undefined ? T.borderOpacity : 1);
    const bgRgb = hexToRgb(bgColor);
    const borderRgb = hexToRgb(borderColor);
    R.style.setProperty('--bg', `rgba(${bgRgb}, ${bgOpacity})`);
    R.style.setProperty('--border', `rgba(${borderRgb}, ${borderOpacity})`);
    R.style.setProperty('--accent', T.accentColor || '#7c3aed');
    R.style.setProperty('--accent-rgb', hexToRgb(T.accentColor || '#7c3aed'));

    // ===== CONTRASTE AUTOMÁTICO =====
    function getLuminance(hex) {
      const rgb = parseInt(hex.slice(1), 16);
      const r = (rgb >> 16) & 0xff, g = (rgb >> 8) & 0xff, b = rgb & 0xff;
      const rs = r / 255, gs = g / 255, bs = b / 255;
      const gamma = c => c <= 0.03928 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4);
      return 0.2126 * gamma(rs) + 0.7152 * gamma(gs) + 0.0722 * gamma(bs);
    }
    const lum = getLuminance(bgColor);
    if (lum > 0.5) {
      R.style.setProperty('--text', '#111111');
      R.style.setProperty('--muted', '#555555');
    } else {
      R.style.setProperty('--text', '#ffffff');

      const g3r = Math.round(r * 0.70), g3g = Math.round(g * 0.70), g3b = Math.round(b * 0.70);
      R.style.setProperty('--goal-grad-1', `rgb(${g1r},${g1g},${g1b})`);

    function adjustTickerFontSize() {
      const container = document.getElementById('tick-inner');
      const userSpan = document.getElementById('tick-user');
      const extraSpan = document.getElementById('tick-extra');
      if (!container || !userSpan || !extraSpan) return;
      const userText = userSpan.textContent;
      const extraText = extraSpan.textContent;
      if (!userText && !extraText) return;
      const containerWidth = container.clientWidth;
      if (containerWidth === 0) { setTimeout(adjustTickerFontSize, 100); return; }
      const badge = document.getElementById('tick-badge');
      const badgeWidth = badge ? badge.offsetWidth : 0;
      const gap = parseFloat(getComputedStyle(container).gap) || 8;
      const marginLeftUser = parseFloat(getComputedStyle(userSpan).marginLeft) || 12;
      const marginLeftExtra = parseFloat(getComputedStyle(extraSpan).marginLeft) || 6;
      const availableWidth = containerWidth - badgeWidth - gap - marginLeftUser - marginLeftExtra;
      if (availableWidth <= 0) return;
      function cloneSpan(span, text, fontSize) {
        const clone = span.cloneNode(true);
        clone.style.position = 'absolute';
        clone.style.visibility = 'hidden';
        clone.style.top = '-9999px';
        clone.style.left = '-9999px';
        clone.style.whiteSpace = 'nowrap';
        clone.style.fontSize = fontSize + 'px';
        clone.textContent = text;
        document.body.appendChild(clone);
        const width = clone.offsetWidth;
        document.body.removeChild(clone);
        return width;
      }
      let userSize = 36;
      let extraSize = 34;
      const minSize = 12;
      function measure() {
        return cloneSpan(userSpan, userText, userSize) + cloneSpan(extraSpan, extraText, extraSize);
      }
      let totalWidth = measure();
      while (totalWidth > availableWidth && userSize > minSize) {
        userSize -= 2;
        extraSize -= 2;
        totalWidth = measure();
      }
      userSpan.style.fontSize = userSize + 'px';
      extraSpan.style.fontSize = extraSize + 'px';
    }
    function initTickerResizeObserver() {
      const container = document.getElementById('tick-inner');
      if (!container) return;
      if (tickerResizeObserver) tickerResizeObserver.disconnect();
      tickerResizeObserver = new ResizeObserver(() => adjustTickerFontSize());
      tickerResizeObserver.observe(container);
    }
    function setTickerText(user = '', extra = '') {
      const userEl = document.getElementById('tick-user');

    function fitGoalNumber(type = 'subs') {
      const map = {
        subs: {
          wrap: 'gst-cnt',
          text: 'gst-txt',
          img: 'gst-heart',
          maxCompact: 56,
          maxFull: 38,
          minCompact: 28,
          minFull: 20
        },
        bits: {
          wrap: 'gst-cnt-bits',
          text: 'gst-bits-txt',
          img: 'gst-bits-gif',

          maxFull: 38,

        },
        follows: {
          wrap: 'gst-cnt-follows',
          text: 'gst-follows-txt',
          img: 'gst-follows-gif',
          maxCompact: 56,
          maxFull: 38,
          minCompact: 28,
          minFull: 20
        }
      };

      const cfg = map[type];
      if (!cfg) return;

      const wrap = document.getElementById(cfg.wrap);
      const text = document.getElementById(cfg.text);
      const img = document.getElementById(cfg.img);
      const widget = document.getElementById('widget');

      if (!wrap || !text || !widget) return;

      const isFull = widget.classList.contains('layout-completo');
      const maxSize = isFull ? cfg.maxFull : cfg.maxCompact;
      const minSize = isFull ? cfg.minFull : cfg.minCompact;

      text.style.fontSize = maxSize + 'px';
      wrap.style.fontSize = maxSize + 'px';

      if (img) {
        img.style.height = '60px';
        img.style.maxWidth = '60px';
      }

      requestAnimationFrame(() => {
        let size = maxSize;

        while (wrap.scrollWidth > wrap.clientWidth && size > minSize) {
          size -= 2;
          text.style.fontSize = size + 'px';
          wrap.style.fontSize = size + 'px';

          if (img) {
            const imgSize = Math.max(isFull ? 32 : 38, Math.min(60, size + 8));
            img.style.height = imgSize + 'px';
            img.style.maxWidth = imgSize + 'px';
          }
        }
      });
    }

    function celebrate(cur, newTgt, user, type = 'subs') {

        else if (type === 'bits') updateBitsGoal(cur, newTgt);

    function getWeatherMeta(code, isDay = 1) {
      const c = Number(code);
      if (c === 0) return { desc: isDay ? 'Soleado' : 'Despejado', cls: 'weather-clear' };
      if (c === 1 || c === 2) return { desc: 'Parcialmente nublado', cls: 'weather-partly' };
      if (c === 3) return { desc: 'Nublado', cls: 'weather-cloudy' };
      if (c === 45 || c === 48) return { desc: 'Niebla', cls: 'weather-fog' };
      if ((c >= 51 && c <= 67) || (c >= 80 && c <= 82)) return { desc: 'Lluvia', cls: 'weather-rainy' };
      if ((c >= 71 && c <= 77) || (c >= 85 && c <= 86)) return { desc: 'Nieve', cls: 'weather-snow' };
      if (c >= 95 && c <= 99) return { desc: 'Tormenta', cls: 'weather-storm' };
      return { desc: 'Clima actual', cls: 'weather-partly' };
    }

    function normalizeTextKey(value) {
      return String(value || '')
        .normalize('NFD')
        .replace(/[\u0300-\u036f]/g, '')
        .toLowerCase()
        .replace(/\s+/g, ' ')
        .trim();
    }

    function compactPlacePart(place) {
      return String(place || '')
        .replace(/-?enriquez/ig, '')
        .replace(/-?enríquez/ig, '')
        .replace(/\s+/g, ' ')
        .trim();
    }

    function compactWeatherCity(value) {
      const raw = String(value || '').trim();
      if (!raw || /^clima local$/i.test(raw)) return 'Clima local';

      const parts = raw.split(',').map(p => p.trim()).filter(Boolean);
      let city = compactPlacePart(parts[0] || raw);
      let state = '';

      if (parts.length > 1) {
        const stateRaw = parts[parts.length - 1];
        state = MX_STATE_ABBR[normalizeTextKey(stateRaw)] || stateRaw;
      }

      let label = state ? `${city}, ${state}` : city;

      return label;

    function setWeatherCard(temp, code, isDay, feels, humidity, wind) {
      const cityEl = document.getElementById('sp-weather-city');

      const windEl = document.getElementById('sp-weather-wind');
      if (!cityEl || !tempEl || !descEl || !visualEl) return;
      const meta = getWeatherMeta(code, isDay);
      cityEl.textContent = compactWeatherCity(weatherCfg.city).toUpperCase();
      tempEl.textContent = Number.isFinite(Number(temp)) ? `${Math.round(Number(temp))}°` : '--°';
      descEl.textContent = meta.desc.toUpperCase();
      if (feelsEl) feelsEl.textContent = Number.isFinite(Number(feels)) ? `${Math.round(Number(feels))}°` : '--°';
      if (humidityEl) humidityEl.textContent = Number.isFinite(Number(humidity)) ? `${Math.round(Number(humidity))}%` : '--%';
      if (windEl) windEl.textContent = Number.isFinite(Number(wind)) ? `${Math.round(Number(wind))}` : '--';
      visualEl.className = 'weather-visual ' + meta.cls;
    }

    async function fetchWeather() {
      if (!showWeather) return;
      const cityEl = document.getElementById('sp-weather-city');
      const tempEl = document.getElementById('sp-weather-temp');
      const descEl = document.getElementById('sp-weather-desc');
      if (cityEl) cityEl.textContent = (weatherCfg.city || 'Clima local').toUpperCase();
      try {
        const url = `https://api.open-meteo.com/v1/forecast?latitude=${encodeURIComponent(weatherLat)}&longitude=${encodeURIComponent(weatherLon)}&current=temperature_2m,apparent_temperature,relative_humidity_2m,wind_speed_10m,weather_code,is_day&temperature_unit=celsius&wind_speed_unit=kmh&timezone=auto`;
        const res = await fetch(url, { cache: 'no-store' });
        if (!res.ok) throw new Error('weather status ' + res.status);
        const data = await res.json();
        const current = data.current || {};
        setWeatherCard(current.temperature_2m, current.weather_code, current.is_day, current.apparent_temperature, current.relative_humidity_2m, current.wind_speed_10m);
      } catch (err) {
        console.warn('[HipeWidget] No se pudo cargar el clima', err);
        if (tempEl) tempEl.textContent = '--°';
        if (descEl) descEl.textContent = 'NO DISPONIBLE';
        const feelsEl = document.getElementById('sp-weather-feels');
        const humidityEl = document.getElementById('sp-weather-humidity');
        const windEl = document.getElementById('sp-weather-wind');
        if (feelsEl) feelsEl.textContent = '--°';
        if (humidityEl) humidityEl.textContent = '--%';
        if (windEl) windEl.textContent = '--';
      }
    }

    // Sponsors
    const sponsorSlides = [];
    const sponsorIndicatorsEl = document.getElementById('sponsor-indicators');
    if (hasSponsorBlock && secSponsor.style.display !== 'none') {
      const activeSp = showSponsors ? (CFG.sponsors || []).filter(s => s.active) : [];
      if (activeSp.length > 0 || showUptime || showCategory || showWeather) document.getElementById('sp-empty').style.display = 'none';
      activeSp.forEach(sp => {
        const div = document.createElement('div');
        div.className = 'sp-slide';
        const isVid = /\.(mp4|webm)$/i.test(sp.imagePath || '');
        if (isVid) {
          const v = document.createElement('video');
          v.src = sp.imagePath; v.autoplay = true; v.loop = true; v.muted = true;
          div.appendChild(v);
        } else {
          const img = document.createElement('img');
          img.src = sp.imagePath || ''; img.alt = sp.name || '';
          div.appendChild(img);
        }
        secSponsor.appendChild(div);
        sponsorSlides.push({ el: div, duration: sp.duration || 8000 });
      });
      if (showUptime) sponsorSlides.push({ el: document.getElementById('sp-uptime'), duration: (CFG.goalRotationSeconds || 30) * 1000 });
      if (showCategory) sponsorSlides.push({ el: document.getElementById('sp-category'), duration: (CFG.goalRotationSeconds || 30) * 1000 });
      if (showWeather) {
        fetchWeather();
        setInterval(fetchWeather, 10 * 60 * 1000);
        sponsorSlides.push({ el: document.getElementById('sp-weather'), duration: (CFG.goalRotationSeconds || 30) * 1000 });
      }
      if (sponsorSlides.length > 0) {
        let si = 0;
        sponsorSlides[0].el.classList.add('on');
        renderIndicators(sponsorIndicatorsEl, sponsorSlides.length, 0, '#4ade80');
        if (sponsorSlides.length > 1) {
          const rotSp = () => {
            sponsorSlides[si].el.classList.remove('on');
            si = (si + 1) % sponsorSlides.length;
            sponsorSlides[si].el.classList.add('on');
            renderIndicators(sponsorIndicatorsEl, sponsorSlides.length, si, '#4ade80');
            setTimeout(rotSp, sponsorSlides[si].duration);
          };
          setTimeout(rotSp, sponsorSlides[0].duration);
        }
      }
    }

    // Socials
    const SOC_ICONS = {
      twitch: { icon: 'mdi:twitch', color: '#9147ff' },
      youtube: { icon: 'mdi:youtube', color: '#ff0000' },
      instagram: { icon: 'mdi:instagram', color: '#e1306c' },
      tiktok: { icon: 'ic:baseline-tiktok', color: '#ffffff' },
      x: { icon: 'ri:twitter-x-fill', color: '#ffffff' },
      facebook: { icon: 'mdi:facebook', color: '#1877f2' },
      discord: { icon: 'mdi:discord', color: '#5865f2' },
    };
    const rotationItems = [];
    const activeSocials = showSocials ? (CFG.socials || []).filter(s => s.active && s.handle) : [];
    const creatorEnabled = !!(showCreatorCode && CFG.creatorCode?.value);

    function buildSocialCard(item) {
      const div = document.createElement('div');
      div.className = 'social-card';
      div.dataset.color = item.color;
      div.dataset.type = item.type;

      if (item.type === 'social') {
        const iconWrap = document.createElement('div');
        iconWrap.className = 'soc-icon-wrap';
        const icon = document.createElement('iconify-icon');
        icon.setAttribute('icon', item.icon);
        icon.setAttribute('width', '26');
        icon.style.color = item.color;
        iconWrap.appendChild(icon);

        const handle = document.createElement('span');
        handle.className = 'soc-hnd';
        handle.style.color = item.color;
        handle.textContent = item.handle;

        div.appendChild(iconWrap);
        div.appendChild(handle);
        return div;
      }

      const badge = document.createElement('div');
      badge.className = 'creator-badge';

      const logoWrap = document.createElement('span');
      logoWrap.className = 'logo-wrapper';
      const img = document.createElement('img');
      img.className = 'creator-logo';
      img.src = item.logo;
      img.alt = 'creator';
      img.onerror = () => { img.style.display = 'none'; };
      logoWrap.appendChild(img);

      const info = document.createElement('div');
      info.className = 'creator-info';
      const label = document.createElement('div');
      label.className = 'creator-label';
      label.textContent = item.label;
      const code = document.createElement('div');
      code.className = 'creator-code';
      code.style.color = item.color;
      code.textContent = item.value;
      info.appendChild(label);
      info.appendChild(code);

      badge.appendChild(logoWrap);
      badge.appendChild(info);
      div.appendChild(badge);
      return div;
    }

    activeSocials.forEach(s => {
      const si = SOC_ICONS[s.platform] || { icon: 'mdi:web', color: '#aaa' };
      rotationItems.push({
        type: 'social', color: si.color, duration: (CFG.socialRotationSeconds || 5) * 1000,
        icon: si.icon, handle: s.handle
      });
    });
    if (creatorEnabled) {
      const accentColor = T.accentColor || '#7c3aed';
      const creatorLabel = CFG.creatorCode?.label || "CÓDIGO DE CREADOR";
      const creatorValue = CFG.creatorCode?.value || "CÓDIGO";
      const creatorLogo = CFG.creatorCode?.logo || "assets/codigo.png";
      rotationItems.push({
        type: 'creator', color: accentColor, duration: (CFG.socialRotationSeconds || 5) * 1000,
        label: creatorLabel, value: creatorValue, logo: creatorLogo
      });
    }
    if (rotationItems.length > 0 && secSocial.style.display !== 'none') {
      const socialStage = document.getElementById('social-stage');
      const socialIndicatorsEl = document.getElementById('social-indicators');
      rotationItems.forEach((item, i) => {
        const div = buildSocialCard(item);
        if (i === 0) div.classList.add('on');
        socialStage.appendChild(div);
      });
      let currentIndex = 0;
      function updateIndicators() {
        const currentItem = rotationItems[currentIndex];
        if (currentItem.type === 'creator') socialIndicatorsEl.style.display = 'none';
        else { socialIndicatorsEl.style.display = 'flex'; renderIndicators(socialIndicatorsEl, rotationItems.length, currentIndex, currentItem.color); }
      }
      function rotateSocial() {
        const items = socialStage.querySelectorAll('.social-card');
        items[currentIndex].classList.remove('on');
        currentIndex = (currentIndex + 1) % rotationItems.length;
        items[currentIndex].classList.add('on');
        updateIndicators();
        setTimeout(rotateSocial, rotationItems[currentIndex].duration);
      }
      updateIndicators();
      if (rotationItems.length > 1) setTimeout(rotateSocial, rotationItems[0].duration);
    }

    // Ticker eventos
    const EV_DEF = {
      sub: ['et-sub', 'SUB', 'mdi:twitch', '#9146FF'], resub: ['et-resub', 'RESUB', 'mdi:twitch', '#b07dff'],
      giftsub: ['et-gift', 'GIFT', 'mdi:gift', '#F97316'], giftbomb: ['et-gift', 'GIFT ×', 'mdi:gift-open', '#F97316'],
      raid: ['et-raid', 'RAID', 'ion:ios-people', '#3B82F6'], bits: ['et-bits', 'BITS', 'material-symbols:diamond-rounded', '#30C4AB'],
      follow: ['et-follow', 'FOLLOW', 'material-symbols-light:favorite-rounded', '#EB4C4C'],
      donate: ['et-donate', 'DONACIÓN', 'tdesign:money-filled', '#179BD7'], redeem: ['et-redeem', 'CANJE', 'bx:coin-stack', '#F59E0B'],
      ytsub: ['et-follow', 'YT SUB', 'mdi:youtube-subscription', '#FF0000'], ytgift: ['et-gift', 'YT GIFT', 'mdi:gift', '#FF6060'],
      member: ['et-member', 'MIEMBRO', 'mdi:youtube', '#FF6060'], super: ['et-super', 'SUPERCHAT', 'mdi:youtube', '#06B6D4']
    };
    const queue = []; let busy = false;
    function pushEvent(ev) { if (!showTicker) return; queue.push(ev); if (!busy) nextEv(); }
    function nextEv() {
      if (!queue.length) { busy = false; return; }
      busy = true;
      const ev = queue.shift();
      const [cls, label, icon, barColor] = EV_DEF[ev.type] || ['et-ok', ev.type.toUpperCase(), 'mdi:bell', '#4ade80'];
      const badge = document.getElementById('tick-badge');
      badge.className = 'ev-badge ' + cls;
      badge.innerHTML = `<span class="ev-icon"><iconify-icon icon="${icon}" width="22"></iconify-icon></span><span class="ev-label">${label}</span>`;
      setTickerText(ev.user || '', ev.extra || '');
      playNotificationSound(ev.type);
      const bar = document.getElementById('tick-bar');
      bar.style.transition = 'none';
      bar.style.background = `linear-gradient(90deg,${barColor},${barColor}CC,${barColor})`;
      bar.style.width = '0%';
      void bar.offsetWidth;
      bar.style.transition = `width ${CFG.tickerDisplaySeconds || 8}s linear`;
      bar.style.width = '100%';
      setTimeout(nextEv, (CFG.tickerDisplaySeconds || 8) * 1000);
    }

    // ========== FUNCIONES PARA BITS ==========
    function requestBitsState() {
      if (ws && ws.readyState === WebSocket.OPEN) {
        // Igual: DoAction para que el Execute() lo reciba como arg directo
        ws.send(JSON.stringify({
          request: "DoAction",
          id: "getBitsState",
          action: { name: "Hipe Widget" },   // <-- mismo nombre de acción
          args: {
            adminAction: "getBitsState"
          }
        }));
      }
    }

    // WebSocket
    function tryParse(s) { try { return JSON.parse(s); } catch { return null; } }
    function tierLbl(t) { return t === '1000' ? 'Tier 1' : t === '2000' ? 'Tier 2' : t === '3000' ? 'Tier 3' : t === 'Prime' ? 'Prime' : t || ''; }

    function connect() {
      ws = new WebSocket(`ws://${CFG.sbHost || '127.0.0.1'}:${CFG.sbPort || 8080}/`);
      ws.onopen = () => {
        setTickerBadge('et-ok', 'ONLINE', 'mdi:check-circle');
        setTickerText('Sistema en línea', '');
        ws.send(JSON.stringify({
          request: 'Subscribe', id: 'hipe',
          events: {
            Twitch: ['Follow', 'Sub', 'ReSub', 'GiftSub', 'GiftBomb', 'Raid', 'Cheer', 'RewardRedemption', 'StreamOnline', 'StreamOffline', 'StreamUpdate'],
            YouTube: ['NewSubscriber', 'NewMember', 'MemberMilestone', 'MembershipGift', 'SuperChat'],
            StreamElements: ['Donation'],
            General: ['Custom']
          }
        }));
        // Pedir estado actual al bot. El C# responde con bitsState y streamState.
        requestBitsState();
      };
      ws.onmessage = (msg) => {
        let d; try { d = JSON.parse(msg.data); } catch { return; }

        // ── CASO 1: broadcast directo del bot via WebsocketBroadcastJson ──
        // Llegan como {"action":"bitsUpdate","current":X,"target":Y}
        // directamente en `d`, sin envoltura de evento.
        if (d.action) {
          handleBotPayload(d);
          return;
        }

        // ── CASO 2: eventos de Streamer.Bot (subs, raids, cheers, etc.) ──
        const src = (d.event?.source || '').toLowerCase();
        const type = (d.event?.type || d.data?.type || d.data?.event ||
          d.data?.eventType || '').toLowerCase();
        const dd = d.data || {};
        const E = CFG.events || {};

        if (src === 'twitch' && (type === 'streamonline' || type === 'online' || type === 'streamoffline' || type === 'offline')) return;

        // General > Custom: mensajes que el bot envía como evento custom
        // (ruta alternativa por si el bot usa SendRawData en vez de WebsocketBroadcastJson)
        if (src === 'general' && type === 'custom') {
          let payload = null;
          if (dd && dd.action) payload = dd;
          else if (typeof dd.message === 'string') payload = tryParse(dd.message);
          else payload = tryParse(JSON.stringify(dd));
          if (payload) { handleBotPayload(payload); return; }
        }

        // ── Eventos de Twitch ──
        if (src === 'twitch') {
          const u = getUsername(dd);
          if (type === 'sub' && E.showSubs) pushEvent({ type: 'sub', user: u, extra: `se suscribió ${tierLbl(dd.subTier) || ''}` });
          if (type === 'resub' && E.showReSubs) pushEvent({ type: 'resub', user: u, extra: `renovó ${dd.cumulativeMonths || dd.months || 1} meses` });
          if (type === 'giftsub' && E.showGiftSubs) pushEvent({ type: 'giftsub', user: u, extra: `regaló sub a ${dd.recipient?.displayName || dd.recipientDisplayName || 'alguien'}` });
          if (type === 'giftbomb' && E.showGiftBombs) pushEvent({ type: 'giftbomb', user: u, extra: `regaló ${dd.gifts || dd.giftCount || 1} subs 🎁` });
          if (type === 'raid' && E.showRaids) pushEvent({ type: 'raid', user: u, extra: `con ${dd.viewers || dd.viewerCount || 0} espectadores` });
          if (type === 'cheer' && E.showCheers) pushEvent({ type: 'bits', user: u, extra: `donó ${dd.bits || dd.bitsAmount || 0} bits` });
          if (type === 'follow' && E.showFollows) pushEvent({ type: 'follow', user: u, extra: `comenzó a seguir` });
          if (type === 'rewardredemption' && E.showRedemptions) pushEvent({ type: 'redeem', user: u, extra: `canjeó "${dd.rewardTitle || dd.reward?.title || 'recompensa'}"` });
        }

        // ── Eventos de YouTube ──
        if (src === 'youtube') {
          const u = dd.user?.displayName || dd.displayName || 'Alguien';
          if ((type === 'newsubscriber' || type === 'subscriber' || type === 'subscription') && E.showYTSubscribers)
            pushEvent({ type: 'ytsub', user: u, extra: `se suscribió al canal` });
          if (type === 'newmember' && E.showYTMembers)
            pushEvent({ type: 'member', user: u, extra: `se unió como miembro ${dd.tier || ''}` });
          if (type === 'membermilestone' && E.showYTMembers)
            pushEvent({ type: 'member', user: u, extra: `celebró su membresía ${dd.months || dd.memberMonths || ''}` });
          if ((type === 'membershipgift' || type === 'giftmembership' || type === 'membershipgifted') && E.showYTGifts)
            pushEvent({ type: 'ytgift', user: u, extra: `regaló una membresía` });
          if (type === 'superchat' && E.showSuperChat)
            pushEvent({ type: 'super', user: u, extra: `envió $${dd.amount || ''} en Super Chat` });
        }

        // ── StreamElements ──
        if (src === 'streamelements' && type === 'donation' && E.showDonations) {
          const u = dd.donor || dd.name || dd.username || 'Anónimo';
          pushEvent({ type: 'donate', user: u, extra: `donó $${dd.amount || ''}` });
        }
      };

      function handleBotPayload(payload) {
        if (!payload || !payload.action) return;

        if (payload.action === 'streamState') {
          const isLive = payload.live === true, was = streamLive;
          setLive(isLive);
          if (isLive) {
            const uptimeSecs = payload.uptime || 0;
            setUptime(uptimeSecs);
            startUptime(false);
            if (!was && bitsActive) requestBitsState();
          } else if (!isLive && was) {
            stopUptime();
            setUptime(0);
          }
          return;
        }

        if (payload.action === 'categoryUpdate') {
          if (showCategory) updateCategory(payload.name, payload.image);
          return;
        }

        if (payload.action === 'goalUpdate') {
          const goalType = payload.type || 'subs';
          if (goalType === 'bits') {
            if (!bitsActive) return;
            updateBitsGoal(+payload.current, +payload.target);
            if (payload.celebrating === true || payload.celebrating === 'true')
              scheduleCelebration(+payload.current, +payload.target, +payload.newTarget || +payload.target, payload.lastUser, 'bits');
          } else if (goalType === 'follows') {
            if (!followsActive) return;
            if (payload.celebrating === true || payload.celebrating === 'true')
              scheduleCelebration(+payload.current, +payload.target, +payload.newTarget, payload.lastUser, 'follows');
            else if (!celebrating)
              updateFollowsGoal(+payload.current, +payload.target);
          } else {
            if (!subsActive) return;
            if (payload.celebrating === true || payload.celebrating === 'true')
              scheduleCelebration(+payload.current, +payload.target, +payload.newTarget, payload.lastUser, 'subs');
            else if (!celebrating)
              updateGoal(+payload.current, +payload.target);
          }
          return;
        }

        if (payload.action === 'bitsState' || payload.action === 'bitsUpdate') {
          updateBitsGoal(+payload.current, +payload.target);
          return;
        }
      }

      function getUsername(data) {
        const candidates = [
          data?.user?.displayName, data?.user?.name, data?.user?.login,
          data?.displayName, data?.userName, data?.username, data?.login, data?.name, data?.user,
          data?.from_broadcaster_user_name, data?.from_broadcaster_user_login,
          data?.from_user_name, data?.from_user_login, data?.to_broadcaster_user_name,
          data?.raider?.displayName, data?.raider?.name, data?.raider_name,
          data?.gifter?.displayName, data?.gifter?.name, data?.gifter_name,
          data?.from_user?.displayName, data?.from_user?.name,
          data?.donor, data?.donation?.donor,
          data?.event?.user?.displayName, data?.event?.user?.name,
          data?.event?.user_name, data?.event?.user_login,
          data?.event?.displayName, data?.event?.username,
          data?.event?.from_broadcaster_user_name,
          data?.user_name, data?.user_login, data?.display_name,
          data?.redemption?.user?.displayName, data?.redemption?.user?.name,
          typeof data === 'string' ? data : null
        ];
        for (let c of candidates) if (c && typeof c === 'string' && c.trim() !== '') return c.trim();
        return 'Alguien';
      }
      ws.onclose = () => {
        setSignalLost();
        if (showTicker) {
          setTickerBadge('et-error', 'OFFLINE', 'mdi:close-circle');
          setTickerText('Reconectando...', '');
        }
        setTimeout(connect, 5000);
      };
      ws.onerror = () => ws.close();
    }

    // Inicialización
    window.addEventListener('load', () => {
      connect();
      const audio = document.getElementById('notification-sound');
      if (audio && audio.load) audio.load();
      const goalAudio = document.getElementById('goal-sound');
      if (goalAudio && goalAudio.load) goalAudio.load();
      setTimeout(() => {
        widgetEl.classList.add('ready');
        initTickerResizeObserver();
        adjustTickerFontSize();
        initGoalRotation();
        fitAllGoalNumbers();
      }, 300);
    });
    setTimeout(() => {
      if (document.getElementById('tick-inner')) {
        adjustTickerFontSize();
        initTickerResizeObserver();
      }
    }, 500);
    window.addEventListener('resize', fitAllGoalNumbers);
    window.addEventListener('resize', fitCategoryName);
  </script>
</body>

</html>
