<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <title>Hipe Widget</title>
  <link
    href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Barlow+Condensed:wght@500;600;700&display=swap"
    rel="stylesheet">
  <script src="https://code.iconify.design/iconify-icon/1.0.8/iconify-icon.min.js"></script>
  <style>
    /* ========== ESTILOS BASE ========== */
    *,
    *::before,
    *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --bg: #111117;
      --border: #22222e;
      --accent: #7c3aed;
      --accent-rgb: 124, 58, 237;
      --text: #ffffff;
      --muted: #aaaaaa;
      --radius: 4px;
      --goal-grad-1: #7c3aed;
      --goal-grad-2: #9d5ff5;
      --goal-grad-3: #5a1fc8;
      --social-soft: rgba(124, 58, 237, .24);
      --social-soft-2: rgba(124, 58, 237, .10);
    }

    html,
    body {
      background: transparent;
      overflow: hidden;
    }

    /* La fuente se aplicará dinámicamente desde JS, pero dejamos un fallback */
    body {
      font-family: 'Rajdhani', sans-serif;
    }

    #widget {
      opacity: 0;
      transition: opacity .5s ease;
      filter: drop-shadow(0 0 12px rgba(0, 0, 0, .35)) drop-shadow(0 0 4px rgba(0, 0, 0, .6));
    }

    #widget.ready {
      opacity: 1;
    }

    #widget.layout-compacto {
      display: flex;
      flex-direction: column;
      padding: 8px;
      gap: 8px;
    }

    #row-top {
      display: flex;
      height: 100px;
      flex-shrink: 0;
    }

    #row-bottom {
      display: flex;
      height: 80px;
      flex-shrink: 0;
    }

    #widget.layout-completo {
      display: flex;
      flex-direction: row;
      padding: 8px;
      gap: 10px;
      align-items: stretch;
    }

    #widget.layout-completo #row-top,
    #widget.layout-completo #row-bottom {
      display: contents;
    }

    .sec {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      display: flex;
      align-items: center;
      overflow: hidden;
      flex-shrink: 0;
      position: relative;
    }

    #sec-id {
      width: 300px;
      padding: 0 16px;
      gap: 10px;
    }

    #widget.layout-completo #sec-id {
      height: 100px;
    }

    #id-avatar {
      width: 68px;
      height: 68px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid var(--border);
      flex-shrink: 0;
    }

    #id-info {
      display: flex;
      flex-direction: column;
      gap: 3px;
      min-width: 0;
    }

    #id-name {
      font-size: 22px;
      font-weight: 700;
      color: var(--text);
      text-transform: uppercase;
      letter-spacing: .05em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      line-height: 1;
    }

    #id-status {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 14px;
      font-weight: 600;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: .08em;
    }

    #live-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #2e2e3a;
      flex-shrink: 0;
      transition: background .4s;
    }

    #live-dot.live {
      background: #ff2d2d;
      animation: pdot 1.4s ease-in-out infinite;
    }

    @keyframes pdot {

      0%,
      100% {
        box-shadow: 0 0 0 0 rgba(255, 45, 45, .6);
      }

      50% {
        box-shadow: 0 0 0 5px rgba(255, 45, 45, 0);
      }
    }

    #sec-goal {
      padding: 0 20px;
      position: relative;
      justify-content: center;
      flex-shrink: 0;
    }

    #widget.layout-completo #sec-goal {
      height: 100px;
      padding: 0 16px;
    }

    .gst {
      position: absolute;
      left: 20px;
      right: 20px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      opacity: 0;
      transform: translateY(-4px);
      transition: opacity .35s, transform .35s;
      pointer-events: none;
    }

    #widget.layout-completo .gst {
      left: 16px;
      right: 16px;
      gap: 4px;
    }

    .gst.on {
      opacity: 1;
      transform: translateY(0px);
      pointer-events: auto;
    }

    #gst-hdr {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    #gst-lbl {
      font-size: 24px;
      font-weight: 700;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: .11em;
      white-space: nowrap;
    }

    #widget.layout-completo #gst-lbl {
      font-size: 20px;
    }

    #gst-cnt {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 56px;
      font-weight: 700;
      color: var(--text);
      line-height: 1;
    }

    #widget.layout-completo #gst-cnt {
      font-size: 38px;
      gap: 6px;
    }

    #gst-heart {
      height: 60px;
      flex-shrink: 0;
    }

    #widget.layout-completo #gst-heart {
      height: 60px;
    }

    #gst-track {
      height: 8px;
      background: rgba(255, 255, 255, .07);
      border-radius: 4px;
      overflow: hidden;
      box-shadow: inset 0 1px 3px rgba(0, 0, 0, .4);
    }

    #widget.layout-completo #gst-track {
      height: 6px;
    }

    #gst-fill {
      height: 100%;
      background: linear-gradient(90deg,
          var(--goal-grad-3) 0%,
          var(--goal-grad-1) 30%,
          var(--goal-grad-2) 50%,
          var(--goal-grad-1) 70%,
          var(--goal-grad-3) 100%);
      border-radius: 4px;
      box-shadow:
        0 0 6px rgba(var(--accent-rgb), 0.5),
        inset 0 1px 0 rgba(255, 255, 255, 0.2);
      transition: width .8s cubic-bezier(.4, 0, .2, 1);
      width: 0%;
      position: relative;
    }

    #gst-fill::after {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 40%;
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.2), transparent);
      border-radius: 4px 4px 0 0;
      pointer-events: none;
    }

    #gst-fill::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: linear-gradient(135deg,
          rgba(255, 255, 255, 0.25) 0%,
          rgba(255, 255, 255, 0) 40%,
          rgba(255, 255, 255, 0) 60%,
          rgba(255, 255, 255, 0.15) 100%);
      border-radius: 4px;
      pointer-events: none;
    }

    #gst-cel {
      align-items: center;
      justify-content: center;
      gap: 4px;
    }

    #cel-txt {
      font-size: 20px;
      font-weight: 700;
      color: #ffd700;
      text-transform: uppercase;
      letter-spacing: .06em;
      text-align: center;
      line-height: 1.2;
      animation: cglow 1s ease-in-out infinite alternate;
    }

    #widget.layout-completo #cel-txt {
      font-size: 14px;
    }

    #cel-usr {
      font-size: 13px;
      color: var(--muted);
      text-align: center;
    }

    #widget.layout-completo #cel-usr {
      font-size: 11px;
    }

    @keyframes cglow {
      from {
        text-shadow: 0 0 8px rgba(255, 215, 0, .4);
      }

      to {
        text-shadow: 0 0 20px rgba(255, 215, 0, .9), 0 0 40px rgba(255, 215, 0, .3);
      }
    }

    #sec-sponsor {
      position: relative;
      justify-content: center;
      padding-bottom: 18px;
      flex-shrink: 0;
    }

    #widget.layout-completo #sec-sponsor {
      height: 100px;
    }

    .sp-slide {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transition: opacity .45s ease;
      pointer-events: none;
      padding-bottom: 12px;
    }

    .sp-slide.on {
      opacity: 1;
      pointer-events: auto;
    }

    #sp-uptime {
      justify-content: center;
      align-items: center;
      text-align: center;
    }

    #sp-ut-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
    }

    #sp-utlbl {
      font-size: 16px;
      font-weight: 700;
      color: var(--accent);
      text-shadow: 0 0 4px rgba(var(--accent-rgb), 0.4);
      text-transform: uppercase;
      letter-spacing: .09em;
      line-height: 1;
    }

    #sp-utval {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 44px;
      font-weight: 700;
      color: var(--text);
      line-height: 1;
      letter-spacing: .03em;
    }

    .sp-slide img,
    .sp-slide video {
      max-height: calc(100% - 16px);
      max-width: calc(100% - 24px);
      object-fit: contain;
    }

    #sp-empty {
      font-size: 13px;
      color: var(--muted);
      opacity: .35;
      font-style: italic;
    }

    #sec-ticker {
      padding: 0 14px;
      position: relative;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      flex-shrink: 0;
    }

    #widget.layout-completo #sec-ticker {
      height: 100px;
      padding: 0 16px;
    }

    #tick-inner {
      display: flex;
      align-items: center;
      gap: 8px;
      width: 100%;
      overflow: hidden;
    }

    .ev-badge {
      display: flex;
      align-items: center;
      gap: 5px;
      padding: 8px 13px 8px 10px;
      border-radius: 4px;
      flex-shrink: 0;
      white-space: nowrap;
    }

    .ev-badge .ev-icon {
      width: 22px;
      height: 22px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .ev-badge .ev-label {
      font-size: 15px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .06em;
      line-height: 1;
    }

    .et-sub {
      background: rgba(145, 70, 255, .25);
    }

    .et-sub .ev-label,
    .et-sub .ev-icon,
    .et-sub iconify-icon {
      color: #9146FF;
    }

    .et-resub {
      background: rgba(145, 70, 255, .20);
    }

    .et-resub .ev-label,
    .et-resub .ev-icon,
    .et-resub iconify-icon {
      color: #b07dff;
    }

    .et-gift {
      background: rgba(249, 115, 22, .25);
    }

    .et-gift .ev-label,
    .et-gift .ev-icon,
    .et-gift iconify-icon {
      color: #F97316;
    }

    .et-raid {
      background: rgba(59, 130, 246, .25);
    }

    .et-raid .ev-label,
    .et-raid .ev-icon,
    .et-raid iconify-icon {
      color: #3B82F6;
    }

    .et-bits {
      background: rgba(48, 196, 171, .25);
    }

    .et-bits .ev-label,
    .et-bits .ev-icon,
    .et-bits iconify-icon {
      color: #30C4AB;
    }

    .et-follow {
      background: rgba(235, 76, 76, .25);
    }

    .et-follow .ev-label,
    .et-follow .ev-icon,
    .et-follow iconify-icon {
      color: #EB4C4C;
    }

    .et-donate {
      background: rgba(23, 155, 215, .25);
    }

    .et-donate .ev-label,
    .et-donate .ev-icon,
    .et-donate iconify-icon {
      color: #179BD7;
    }

    .et-redeem {
      background: rgba(245, 158, 11, .25);
    }

    .et-redeem .ev-label,
    .et-redeem .ev-icon,
    .et-redeem iconify-icon {
      color: #F59E0B;
    }

    .et-member {
      background: rgba(255, 0, 0, .20);
    }

    .et-member .ev-label,
    .et-member .ev-icon,
    .et-member iconify-icon {
      color: #FF6060;
    }

    .et-super {
      background: rgba(6, 182, 212, .25);
    }

    .et-super .ev-label,
    .et-super .ev-icon,
    .et-super iconify-icon {
      color: #06B6D4;
    }

    .et-ok {
      background: rgba(74, 222, 128, .15);
    }

    .et-ok .ev-label,
    .et-ok .ev-icon,
    .et-ok iconify-icon {
      color: #4ade80;
    }

    #tick-user {
      font-size: 36px;
      font-weight: 700;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      flex: 0 1 auto;
      min-width: 0;
      letter-spacing: 0.02em;
      margin-left: 12px;
    }

    #tick-extra {
      font-size: 34px;
      font-weight: 600;
      color: var(--muted);
      white-space: nowrap;
      flex: 0 0 auto;
      margin-left: 6px;
      overflow: hidden;
      text-overflow: ellipsis;
      line-height: 1.2;
    }

    #tick-bar {
      position: absolute;
      bottom: 0;
      left: 0;
      height: 6px;
      width: 0%;
      border-radius: 0 2px 2px 0;
    }

    #sec-social {
      position: relative;
      justify-content: center;
      flex-shrink: 0;
    }

    #widget.layout-completo #sec-social {
      height: 100px;
    }

    .social-stage {
      position: absolute;
      inset: 0;
      padding: 0 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .social-card {
      position: absolute;
      left: 50%;
      top: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
      max-width: calc(100% - 12px);
      min-width: 0;
      opacity: 0;
      pointer-events: none;
      transform: translate(-50%, -50%);
      transition: opacity .4s ease, transform .4s ease;
    }

    .social-card.on {
      opacity: 1;
      pointer-events: auto;
    }

    .soc-icon-wrap {
      width: 40px;
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      border-bottom: 2px solid var(--accent);
      padding-bottom: 4px;
      margin-bottom: 2px;
    }

    .soc-icon-wrap iconify-icon {
      width: 32px;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .soc-hnd {
      font-size: 34px;
      font-weight: 700;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      min-width: 0;
      max-width: 220px;
      line-height: 1;
      text-shadow: 0 1px 8px rgba(0, 0, 0, .4);
    }

    .creator-badge {
      display: flex;
      flex-direction: row;
      align-items: center;
      justify-content: center;
      gap: 16px;
      min-width: 0;
      max-width: 100%;
    }

    .creator-info {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      justify-content: center;
      gap: 4px;
      min-width: 0;
    }

    .creator-label {
      font-size: 13px;
      line-height: 1;
      font-weight: 700;
      letter-spacing: .16em;
      color: var(--muted);
      text-transform: uppercase;
      white-space: nowrap;
    }

    .logo-wrapper {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-bottom: 2px solid var(--accent);
      padding-bottom: 4px;
      margin-bottom: 2px;
    }

    .creator-logo {
      height: 52px;
      width: auto;
      display: block;
      object-fit: contain;
    }

    .creator-code {
      font-size: 28px;
      line-height: 1;
      font-weight: 700;
      white-space: nowrap;
      text-transform: uppercase;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 260px;
      color: var(--text);
    }

    .rot-ind {
      position: absolute;
      left: 50%;
      bottom: 8px;
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      z-index: 10;
      min-width: max-content;
      pointer-events: none;
    }

    .rot-ind .dot {
      width: 5px;
      height: 5px;
      border-radius: 999px;
      background: rgba(255, 255, 255, .22);
      transition: width .25s ease, background .25s ease;
      flex: 0 0 auto;
    }

    .rot-ind .dot.active {
      width: 14px;
    }
  </style>
  <!-- Carga dinámica de fuente adicional si se especifica (no se usa en <style>, se inyecta desde JS) -->
</head>

<body>
  <div id="widget">
    <div id="row-top">
      <div class="sec" id="sec-id">
        <img id="id-avatar" src="" alt="">
        <div id="id-info">
          <div id="id-name">HIPE</div>
          <div id="id-status">
            <div id="live-dot"></div>
            <span id="live-txt">OFFLINE</span>
          </div>
        </div>
      </div>

      <div class="sec" id="sec-goal">
        <div class="gst on" id="gst-normal">
          <div id="gst-hdr">
            <span id="gst-lbl">META SUBS</span>
            <div id="gst-cnt">
              <img id="gst-heart" src="" alt="♥">
              <span id="gst-txt">--/--</span>
            </div>
          </div>
          <div id="gst-track">
            <div id="gst-fill"></div>
          </div>
        </div>
        <div class="gst" id="gst-cel">
          <div id="cel-txt">¡META ALCANZADA! 🎉</div>
          <div id="cel-usr"></div>
        </div>
      </div>

      <div class="sec" id="sec-sponsor">
        <span id="sp-empty">Sin sponsor</span>
        <div class="sp-slide" id="sp-uptime">
          <div id="sp-ut-wrap">
            <div id="sp-utlbl">EN VIVO</div>
            <div id="sp-utval">00:00:00</div>
          </div>
        </div>
        <div class="rot-ind" id="sponsor-indicators"></div>
      </div>
    </div>

    <div id="row-bottom">
      <div class="sec" id="sec-ticker">
        <div id="tick-inner">
          <div class="ev-badge et-ok" id="tick-badge">
            <span class="ev-icon"><iconify-icon icon="mdi:check-circle" width="16"></iconify-icon></span>
            <span class="ev-label">HIPE</span>
          </div>
          <span id="tick-user">Conectando con Streamer.bot...</span>
          <span id="tick-extra"></span>
        </div>
        <div id="tick-bar"></div>
      </div>

      <div class="sec" id="sec-social">
        <div class="social-stage" id="social-stage"></div>
        <div class="rot-ind" id="social-indicators"></div>
      </div>
    </div>
  </div>

  <!-- Reproductor de sonido para notificaciones -->
  <audio id="notification-sound" preload="auto" src="assets/notification.mp3" style="display: none;"></audio>

  <script>
    // ================== FASES ==================
    const FASES = {
      sponsor_social: { bodyW: 1200, bodyH: 204, gapH: 12, id: 300, goal: 470, sponsor: 390, ticker: 872, social: 300, hasSponsor: true, hasSocial: true },
      sponsor_nosocial: { bodyW: 1200, bodyH: 204, gapH: 12, id: 300, goal: 470, sponsor: 390, ticker: 1184, social: 0, hasSponsor: true, hasSocial: false },
      nosponsor_social: { bodyW: 800, bodyH: 204, gapH: 14, id: 300, goal: 470, sponsor: 0, ticker: 470, social: 300, hasSponsor: false, hasSocial: true },
      nosponsor_nosocial: { bodyW: 800, bodyH: 204, gapH: 14, id: 300, goal: 470, sponsor: 0, ticker: 784, social: 0, hasSponsor: false, hasSocial: false },
      completo: { bodyW: 1920, bodyH: 116, gapH: 10, id: 300, goal: 370, sponsor: 300, ticker: 594, social: 300, hasSponsor: true, hasSocial: true }
    };

    // ==================== LEER CONFIGURACIÓN DESDE LA URL ====================
    let CFG = {};
    const urlParams = new URLSearchParams(window.location.search);
    const configParam = urlParams.get('config');
    if (configParam) {
      try {
        const decoded = atob(configParam);
        const json = decodeURIComponent(escape(decoded));
        CFG = JSON.parse(json);
      } catch (e) {
        console.warn('Error al leer la configuración de la URL', e);
      }
    }

    // ========== VALORES POR DEFECTO ==========
    const logoPath = CFG.logoPath || 'assets/logo.png';
    const goalGifPath = CFG.goalGifPath || 'assets/corazon.gif';
    const enableSounds = CFG.enableSounds === undefined ? true : CFG.enableSounds === true;
    const notificationVolume = (CFG.notificationVolume !== undefined ? CFG.notificationVolume : 80) / 100;
    const defaultEvents = {
      showSubs: true, showReSubs: true, showGiftSubs: true, showGiftBombs: true,
      showRaids: true, showCheers: true, showFollows: true, showRedemptions: true,
      showYTMembers: true, showSuperChat: true, showDonations: true
    };
    const eventsFromCfg = CFG.events || {};
    const events = { ...defaultEvents, ...eventsFromCfg };
    const defaultSoundEvents = {
      soundSubs: true, soundReSubs: true, soundGiftSubs: true, soundGiftBombs: true,
      soundRaids: true, soundCheers: true, soundFollows: true, soundRedemptions: true,
      soundYTMembers: true, soundSuperChat: true, soundDonations: true
    };
    const soundEventsFromCfg = CFG.soundEvents || {};
    const soundEvents = { ...defaultSoundEvents, ...soundEventsFromCfg };

    CFG.logoPath = logoPath;
    CFG.goalGifPath = goalGifPath;
    CFG.events = events;
    CFG.soundEvents = soundEvents;
    CFG.enableSounds = enableSounds;
    CFG.notificationVolume = notificationVolume * 100;

    if (CFG.creatorCode && !CFG.creatorCode.logo) {
      CFG.creatorCode.logo = 'assets/codigo.png';
    } else if (CFG.creatorCode === undefined && (CFG.showCreatorCode === true)) {
      CFG.creatorCode = {
        active: true,
        label: "CÓDIGO DE CREADOR",
        value: "CÓDIGO",
        logo: "assets/codigo.png"
      };
    }

    const T = CFG.theme || {};
    const R = document.documentElement;

    // Mapeo de sonidos
    const soundMap = {
      'sub': 'soundSubs', 'resub': 'soundReSubs', 'giftsub': 'soundGiftSubs', 'giftbomb': 'soundGiftBombs',
      'raid': 'soundRaids', 'bits': 'soundCheers', 'follow': 'soundFollows', 'redeem': 'soundRedemptions',
      'member': 'soundYTMembers', 'super': 'soundSuperChat', 'donate': 'soundDonations'
    };

    function playNotificationSound(eventType) {
      if (!enableSounds) return;
      const soundKey = soundMap[eventType];
      if (!soundKey) return;
      const allowed = soundEvents[soundKey] === undefined ? true : soundEvents[soundKey];
      if (!allowed) return;
      const audio = document.getElementById('notification-sound');
      if (!audio) return;
      if (audio.readyState < 2) {
        setTimeout(() => playNotificationSound(eventType), 200);
        return;
      }
      try {
        audio.pause();
        audio.currentTime = 0;
        audio.play().catch(e => console.warn('Sonido no reproducido:', e));
      } catch (e) {
        console.warn('Error al reproducir sonido:', e);
      }
    }

    const audioElem = document.getElementById('notification-sound');
    if (audioElem) audioElem.volume = notificationVolume;

    function normalizeLayout(raw) { return (raw === 'horizontal' || raw === 'completo') ? 'completo' : 'compacto'; }
    const layoutMode = normalizeLayout(CFG.layout);
    const isCompacto = layoutMode === 'compacto';
    const isCompleto = layoutMode === 'completo';

    function hexToRgb(hex) {
      const h = (hex || '').replace('#', '').trim();
      if (h.length !== 6) return '124,58,237';
      const n = parseInt(h, 16);
      return `${(n >> 16) & 255},${(n >> 8) & 255},${n & 255}`;
    }

    // ===== APLICAR COLORES CON OPACIDAD Y BORDES =====
    const bgColor = T.bgColor || '#111117';
    const borderColor = T.borderColor || '#22222e';
    const bgOpacity = (T.bgOpacity !== undefined ? T.bgOpacity : 1);
    const borderOpacity = (T.borderOpacity !== undefined ? T.borderOpacity : 1);

    const bgRgb = hexToRgb(bgColor);
    const borderRgb = hexToRgb(borderColor);

    R.style.setProperty('--bg', `rgba(${bgRgb}, ${bgOpacity})`);
    R.style.setProperty('--border', `rgba(${borderRgb}, ${borderOpacity})`);
    R.style.setProperty('--accent', T.accentColor || '#7c3aed');
    R.style.setProperty('--accent-rgb', hexToRgb(T.accentColor || '#7c3aed'));

    // ===== CONTRASTE AUTOMÁTICO (según luminosidad del color de fondo original, sin opacidad) =====
    function getLuminance(hex) {
      const rgb = parseInt(hex.slice(1), 16);
      const r = (rgb >> 16) & 0xff;
      const g = (rgb >> 8) & 0xff;
      const b = (rgb >> 0) & 0xff;
      const rs = r / 255, gs = g / 255, bs = b / 255;
      const gamma = (c) => c <= 0.03928 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4);
      const lum = 0.2126 * gamma(rs) + 0.7152 * gamma(gs) + 0.0722 * gamma(bs);
      return lum;
    }
    const lum = getLuminance(bgColor);
    if (lum > 0.5) {
      R.style.setProperty('--text', '#111111');
      R.style.setProperty('--muted', '#555555');
    } else {
      R.style.setProperty('--text', '#ffffff');
      R.style.setProperty('--muted', '#aaaaaa');
    }

    R.style.setProperty('--radius', T.borderRadius || '4px');

    // Gradientes de acento (igual que antes)
    (function () {
      const rgb = hexToRgb(T.accentColor || '#7c3aed').split(',').map(Number);
      const r = rgb[0], g = rgb[1], b = rgb[2];
      const g1r = Math.round(r + (255 - r) * .28), g1g = Math.round(g + (255 - g) * .28), g1b = Math.round(b + (255 - b) * .28);
      const g2r = r, g2g = g, g2b = b;
      const g3r = Math.round(r * .70), g3g = Math.round(g * .70), g3b = Math.round(b * .70);
      R.style.setProperty('--goal-grad-1', `rgb(${g1r},${g1g},${g1b})`);
      R.style.setProperty('--goal-grad-2', `rgb(${g2r},${g2g},${g2b})`);
      R.style.setProperty('--goal-grad-3', `rgb(${g3r},${g3g},${g3b})`);
      R.style.setProperty('--social-soft', `rgba(${r},${g},${b},.24)`);
      R.style.setProperty('--social-soft-2', `rgba(${r},${g},${b},.10)`);
    })();

    // ===== TIPOGRAFÍA (personalizada, excepto cronómetro) =====
    const customFont = T.fontFamily ? T.fontFamily.trim() : '';
    if (customFont && customFont !== 'Rajdhani') {
      // Cargar la fuente desde Google Fonts si no es una de las precargadas
      const link = document.createElement('link');
      link.href = `https://fonts.googleapis.com/css2?family=${customFont.replace(/ /g, '+')}:wght@400;500;600;700&display=swap`;
      link.rel = 'stylesheet';
      document.head.appendChild(link);
      // Aplicar la fuente al body (excepto .sp-utval que ya tiene Barlow Condensed)
      document.body.style.fontFamily = `'${customFont}', 'Rajdhani', sans-serif`;
    } else {
      document.body.style.fontFamily = "'Rajdhani', sans-serif";
    }

    document.getElementById('id-avatar').src = CFG.logoPath || '';
    document.getElementById('id-name').textContent = (CFG.channelName || 'HIPE').toUpperCase();
    document.getElementById('gst-heart').src = CFG.goalGifPath || '';

    const widgetEl = document.getElementById('widget');
    const secId = document.getElementById('sec-id');
    const secGoal = document.getElementById('sec-goal');
    const secSponsor = document.getElementById('sec-sponsor');
    const secTicker = document.getElementById('sec-ticker');
    const secSocial = document.getElementById('sec-social');
    const rowTop = document.getElementById('row-top');
    const rowBottom = document.getElementById('row-bottom');

    const showBranding = isCompacto ? true : (CFG.showBranding !== false);
    const showGoal = isCompacto ? true : (CFG.showGoal !== false);
    const showTicker = isCompacto ? true : (CFG.showTicker !== false);
    const showSponsors = CFG.showSponsors !== false;
    const showUptime = CFG.showUptime !== false;
    const showSocials = CFG.showSocials !== false;
    const showCreatorCode = !!(CFG.showCreatorCode ?? CFG.creatorCode?.active ?? false);
    const hasSponsorBlock = showSponsors || showUptime;

    function setW(el, px) {
      el.style.width = px + 'px';
      el.style.minWidth = px + 'px';
      el.style.maxWidth = px + 'px';
      el.style.flex = `0 0 ${px}px`;
    }

    function applyPhase(faseKey) {
      const f = FASES[faseKey];
      document.body.style.width = f.bodyW + 'px';
      document.body.style.height = f.bodyH + 'px';
      widgetEl.style.width = f.bodyW + 'px';
      widgetEl.style.height = f.bodyH + 'px';
      rowTop.style.gap = f.gapH + 'px';
      rowBottom.style.gap = f.gapH + 'px';
      setW(secId, f.id);
      setW(secGoal, f.goal);
      if (faseKey === 'completo') {
        if (secSponsor.style.display !== 'none') setW(secSponsor, f.sponsor);
      } else {
        if (f.hasSponsor) { secSponsor.style.display = ''; setW(secSponsor, f.sponsor); }
        else secSponsor.style.display = 'none';
      }
      setW(secTicker, f.ticker);
      if (faseKey === 'completo') {
        if (secSocial.style.display !== 'none') setW(secSocial, f.social);
      } else {
        if (f.hasSocial) { secSocial.style.display = ''; setW(secSocial, f.social); }

    document.body.classList.add(`layout-${layoutMode}`);
    widgetEl.classList.add(`layout-${layoutMode}`);

    const hasSocialContent = (showSocials && (CFG.socials || []).some(s => s.active && s.handle)) ||

    if (isCompleto) {
      if (!showBranding) secId.style.display = 'none';
      if (!showGoal) secGoal.style.display = 'none';
      if (!showTicker) secTicker.style.display = 'none';

      if (!hasSocialContent) secSocial.style.display = 'none';
    }

    if (isCompleto) applyPhase('completo');
    else {
      if (hasSponsorBlock && hasSocialContent) applyPhase('sponsor_social');
      else if (hasSponsorBlock && !hasSocialContent) applyPhase('sponsor_nosocial');
      else if (!hasSponsorBlock && hasSocialContent) applyPhase('nosponsor_social');
      else applyPhase('nosponsor_nosocial');
    }

    // ========== TICKER AJUSTE DINÁMICO (sin cambios) ==========
    let tickerResizeObserver = null;
    function adjustTickerFontSize() {
      const container = document.getElementById('tick-inner');
      const userSpan = document.getElementById('tick-user');
      const extraSpan = document.getElementById('tick-extra');
      if (!container || !userSpan || !extraSpan) return;
      const userText = userSpan.textContent;
      const extraText = extraSpan.textContent;
      if (!userText && !extraText) return;
      const containerWidth = container.clientWidth;
      if (containerWidth === 0) { setTimeout(adjustTickerFontSize, 100); return; }
      const badge = document.getElementById('tick-badge');
      const badgeWidth = badge ? badge.offsetWidth : 0;
      const gap = parseFloat(getComputedStyle(container).gap) || 8;
      const marginLeftUser = parseFloat(getComputedStyle(userSpan).marginLeft) || 12;
      const marginLeftExtra = parseFloat(getComputedStyle(extraSpan).marginLeft) || 6;
      const availableWidth = containerWidth - badgeWidth - gap - marginLeftUser - marginLeftExtra;
      if (availableWidth <= 0) return;
      function cloneSpan(span, text, fontSize) {
        const clone = span.cloneNode(true);
        clone.style.position = 'absolute';
        clone.style.visibility = 'hidden';
        clone.style.top = '-9999px';
        clone.style.left = '-9999px';
        clone.style.whiteSpace = 'nowrap';
        clone.style.fontSize = fontSize + 'px';
        clone.textContent = text;
        document.body.appendChild(clone);
        const width = clone.offsetWidth;
        document.body.removeChild(clone);
        return width;
      }
      let userSize = 36;
      let extraSize = 34;
      const minSize = 14;
      function measure() {
        const userW = cloneSpan(userSpan, userText, userSize);
        const extraW = cloneSpan(extraSpan, extraText, extraSize);
        return userW + extraW;
      }
      let totalWidth = measure();
      while (totalWidth > availableWidth && userSize > minSize) {
        userSize -= 2;
        extraSize -= 2;
        totalWidth = measure();
      }
      userSpan.style.fontSize = userSize + 'px';
      extraSpan.style.fontSize = extraSize + 'px';
    }
    function initTickerResizeObserver() {
      const container = document.getElementById('tick-inner');
      if (!container) return;
      if (tickerResizeObserver) tickerResizeObserver.disconnect();
      tickerResizeObserver = new ResizeObserver(() => adjustTickerFontSize());
      tickerResizeObserver.observe(container);
    }

    // ========== RESTO DE LÓGICA (eventos, sponsors, social, websocket) ==========
    let celebrating = false, celTimer = null;
    let uptimeSeconds = 0, uptimeInterval = null, streamLive = false;

    function setLive(on) {
      document.getElementById('live-dot').classList.toggle('live', on);
      document.getElementById('live-txt').textContent = on ? 'EN VIVO' : 'OFFLINE';
    }
    function updateGoal(cur, tgt) {
      document.getElementById('gst-txt').textContent = `${cur}/${tgt}`;
      document.getElementById('gst-fill').style.width = Math.min(cur / Math.max(tgt || 1, 1) * 100, 100) + '%';
    }
    function showGst(id) {
      document.getElementById('gst-normal').classList.toggle('on', id === 'gst-normal');
      document.getElementById('gst-cel').classList.toggle('on', id === 'gst-cel');
    }
    function celebrate(cur, newTgt, user) {
      celebrating = true;
      document.getElementById('cel-usr').textContent = user ? `¡Gracias ${user}!` : '';
      showGst('gst-cel');
      if (celTimer) clearTimeout(celTimer);
      celTimer = setTimeout(() => {
        celebrating = false;
        updateGoal(cur, newTgt);
        showGst('gst-normal');
      }, (CFG.goalCelebrationSeconds || 10) * 1000);
    }
    function setUptime(s) {
      uptimeSeconds = Math.max(0, Math.floor(s || 0));
      const h = String(Math.floor(uptimeSeconds / 3600)).padStart(2, '0');
      const m = String(Math.floor(uptimeSeconds % 3600 / 60)).padStart(2, '0');
      const sec = String(uptimeSeconds % 60).padStart(2, '0');
      document.getElementById('sp-utval').textContent = `${h}:${m}:${sec}`;
    }
    function startUptime(reset = false) {
      streamLive = true;
      if (reset) setUptime(0);
      if (uptimeInterval) clearInterval(uptimeInterval);
      uptimeInterval = setInterval(() => { if (streamLive) setUptime(uptimeSeconds + 1); }, 1000);
    }
    function stopUptime() {
      streamLive = false;
      if (uptimeInterval) { clearInterval(uptimeInterval); uptimeInterval = null; }
    }

    function renderIndicators(container, count, activeIdx, activeColor) {
      container.innerHTML = '';
      if (count < 2) return;
      for (let i = 0; i < count; i++) {
        const el = document.createElement('span');
        el.className = 'dot' + (i === activeIdx ? ' active' : '');
        el.style.background = i === activeIdx ? (activeColor || 'var(--accent)') : 'rgba(255,255,255,.22)';
        container.appendChild(el);
      }
    }

    // Sponsors
    const sponsorSlides = [];
    const sponsorIndicatorsEl = document.getElementById('sponsor-indicators');
    if (hasSponsorBlock && secSponsor.style.display !== 'none') {
      const activeSp = showSponsors ? (CFG.sponsors || []).filter(s => s.active) : [];
      if (activeSp.length > 0 || showUptime) document.getElementById('sp-empty').style.display = 'none';
      activeSp.forEach(sp => {
        const div = document.createElement('div');
        div.className = 'sp-slide';
        const isVid = /\.(mp4|webm)$/i.test(sp.imagePath || '');
        if (isVid) {
          const v = document.createElement('video');
          v.src = sp.imagePath; v.autoplay = true; v.loop = true; v.muted = true;
          div.appendChild(v);
        } else {
          const img = document.createElement('img');
          img.src = sp.imagePath || ''; img.alt = sp.name || '';
          div.appendChild(img);
        }
        secSponsor.appendChild(div);
        sponsorSlides.push({ el: div, duration: sp.duration || 8000 });
      });
      if (showUptime) sponsorSlides.push({ el: document.getElementById('sp-uptime'), duration: (CFG.goalRotationSeconds || 30) * 1000 });
      if (sponsorSlides.length > 0) {
        let si = 0;
        sponsorSlides[0].el.classList.add('on');
        renderIndicators(sponsorIndicatorsEl, sponsorSlides.length, 0, '#4ade80');
        if (sponsorSlides.length > 1) {
          const rotSp = () => {
            sponsorSlides[si].el.classList.remove('on');
            si = (si + 1) % sponsorSlides.length;
            sponsorSlides[si].el.classList.add('on');
            renderIndicators(sponsorIndicatorsEl, sponsorSlides.length, si, '#4ade80');
            setTimeout(rotSp, sponsorSlides[si].duration);
          };
          setTimeout(rotSp, sponsorSlides[0].duration);
        }
      }
    }

    // Socials
    const SOC_ICONS = {
      twitch: { icon: 'mdi:twitch', color: '#9147ff' },
      youtube: { icon: 'mdi:youtube', color: '#ff0000' },
      instagram: { icon: 'mdi:instagram', color: '#e1306c' },
      tiktok: { icon: 'ic:baseline-tiktok', color: '#ffffff' },
      x: { icon: 'ri:twitter-x-fill', color: '#ffffff' },
      facebook: { icon: 'mdi:facebook', color: '#1877f2' },
      discord: { icon: 'mdi:discord', color: '#5865f2' },
    };
    const rotationItems = [];
    const activeSocials = showSocials ? (CFG.socials || []).filter(s => s.active && s.handle) : [];
    const creatorEnabled = !!(showCreatorCode && CFG.creatorCode?.value);
    activeSocials.forEach(s => {
      const si = SOC_ICONS[s.platform] || { icon: 'mdi:web', color: '#aaa' };
      rotationItems.push({
        type: 'social', color: si.color, duration: (CFG.socialRotationSeconds || 5) * 1000,
        html: `<div class="soc-icon-wrap"><iconify-icon icon="${si.icon}" width="26" style="color:${si.color}"></iconify-icon></div><span class="soc-hnd" style="color:${si.color}">${s.handle}</span>`
      });
    });
    if (creatorEnabled) {
      const accentColor = T.accentColor || '#7c3aed';
      const creatorLabel = CFG.creatorCode?.label || "CÓDIGO DE CREADOR";
      const creatorValue = CFG.creatorCode?.value || "CÓDIGO";
      const creatorLogo = CFG.creatorCode?.logo || "assets/codigo.png";
      rotationItems.push({
        type: 'creator', color: accentColor, duration: (CFG.socialRotationSeconds || 5) * 1000,
        html: `<div class="creator-badge"><span class="logo-wrapper"><img class="creator-logo" src="${creatorLogo}" alt="creator" onerror="this.style.display='none'"></span><div class="creator-info"><div class="creator-label">${creatorLabel}</div><div class="creator-code" style="color:${accentColor}">${creatorValue}</div></div></div>`
      });
    }
    if (rotationItems.length > 0 && secSocial.style.display !== 'none') {
      const socialStage = document.getElementById('social-stage');
      const socialIndicatorsEl = document.getElementById('social-indicators');
      rotationItems.forEach((item, i) => {
        const div = document.createElement('div');
        div.className = 'social-card' + (i === 0 ? ' on' : '');
        div.dataset.color = item.color;
        div.dataset.type = item.type;
        div.innerHTML = item.html;
        socialStage.appendChild(div);
      });
      let currentIndex = 0;
      function updateIndicators() {
        const currentItem = rotationItems[currentIndex];
        if (currentItem.type === 'creator') socialIndicatorsEl.style.display = 'none';
        else { socialIndicatorsEl.style.display = 'flex'; renderIndicators(socialIndicatorsEl, rotationItems.length, currentIndex, currentItem.color); }
      }
      function rotateSocial() {
        const items = socialStage.querySelectorAll('.social-card');
        items[currentIndex].classList.remove('on');
        currentIndex = (currentIndex + 1) % rotationItems.length;
        items[currentIndex].classList.add('on');
        updateIndicators();
        setTimeout(rotateSocial, rotationItems[currentIndex].duration);
      }
      updateIndicators();
      if (rotationItems.length > 1) setTimeout(rotateSocial, rotationItems[0].duration);
    }

    // Ticker eventos
    const EV_DEF = {
      sub: ['et-sub', 'SUB', 'mdi:twitch', '#9146FF'],
      resub: ['et-resub', 'RESUB', 'mdi:twitch', '#b07dff'],
      giftsub: ['et-gift', 'GIFT', 'mdi:gift', '#F97316'],
      giftbomb: ['et-gift', 'GIFT ×', 'mdi:gift-open', '#F97316'],
      raid: ['et-raid', 'RAID', 'ion:ios-people', '#3B82F6'],
      bits: ['et-bits', 'BITS', 'material-symbols:diamond-rounded', '#30C4AB'],
      follow: ['et-follow', 'FOLLOW', 'material-symbols-light:favorite-rounded', '#EB4C4C'],
      donate: ['et-donate', 'DONACIÓN', 'tdesign:money-filled', '#179BD7'],
      redeem: ['et-redeem', 'CANJE', 'bx:coin-stack', '#F59E0B'],
      member: ['et-member', 'MIEMBRO', 'mdi:youtube', '#FF6060'],
      super: ['et-super', 'SUPERCHAT', 'mdi:youtube', '#06B6D4'],
    };
    const queue = []; let busy = false;
    function pushEvent(ev) { queue.push(ev); if (!busy) nextEv(); }
    function nextEv() {
      if (!queue.length) { busy = false; return; }
      busy = true;
      const ev = queue.shift();
      const [cls, label, icon, barColor] = EV_DEF[ev.type] || ['et-ok', ev.type.toUpperCase(), 'mdi:bell', '#4ade80'];
      const badge = document.getElementById('tick-badge');
      badge.className = 'ev-badge ' + cls;
      badge.innerHTML = `<span class="ev-icon"><iconify-icon icon="${icon}" width="22"></iconify-icon></span><span class="ev-label">${label}</span>`;
      document.getElementById('tick-user').textContent = ev.user || '';
      document.getElementById('tick-extra').textContent = ev.extra || '';
      playNotificationSound(ev.type);
      setTimeout(adjustTickerFontSize, 0);
      const bar = document.getElementById('tick-bar');
      bar.style.transition = 'none';
      bar.style.background = `linear-gradient(90deg,${barColor},${barColor}CC,${barColor})`;
      bar.style.width = '0%';
      void bar.offsetWidth;
      bar.style.transition = `width ${CFG.tickerDisplaySeconds || 8}s linear`;
      bar.style.width = '100%';
      setTimeout(nextEv, (CFG.tickerDisplaySeconds || 8) * 1000);
    }

    // WebSocket
    function tryParse(s) { try { return JSON.parse(s); } catch { return null; } }
    function tierLbl(t) { return t === '1000' ? 'Tier 1' : t === '2000' ? 'Tier 2' : t === '3000' ? 'Tier 3' : t === 'Prime' ? 'Prime' : t || ''; }

    function connect() {
      const ws = new WebSocket(`ws://${CFG.sbHost || '127.0.0.1'}:${CFG.sbPort || 8080}/`);
      ws.onopen = () => {
        document.getElementById('tick-user').textContent = 'Bienvenido ✓  —  Sistema en línea';
        setTimeout(adjustTickerFontSize, 0);
        ws.send(JSON.stringify({
          request: 'Subscribe', id: 'hipe',
          events: {
            Twitch: ['Follow', 'Sub', 'ReSub', 'GiftSub', 'GiftBomb', 'Raid', 'Cheer', 'RewardRedemption', 'StreamOnline', 'StreamOffline'],
            YouTube: ['NewMember', 'MemberMilestone', 'SuperChat'],
            StreamElements: ['Donation'],
            General: ['Custom']
          }
        }));
        ws.send(JSON.stringify({ request: 'GetChannelInfo', id: 'hipe-livecheck' }));
      };
      ws.onmessage = (msg) => {
        let d; try { d = JSON.parse(msg.data); } catch { return; }
        if (d.id === 'hipe-livecheck') {
          const isLive = d.response?.isLive || d.data?.isLive || false;
          setLive(isLive); if (!isLive) stopUptime(); return;
        }
        const src = (d.event?.source || '').toLowerCase();
        const type = (d.event?.type || d.data?.type || d.data?.event || d.data?.eventType || d.data?.subscription?.type || '').toLowerCase();
        const dd = d.data || {};
        const E = CFG.events || {};
        if (src === 'twitch' && (type === 'streamonline' || type === 'online')) {
          const was = streamLive; setLive(true); if (!was) startUptime(true); return;
        }
        if (src === 'twitch' && (type === 'streamoffline' || type === 'offline')) {
          const was = streamLive; setLive(false); if (was) stopUptime(); return;
        }
        if (src === 'general' && type === 'custom') {
          const payload = (typeof dd === 'object' && dd.action) ? dd : (typeof dd.message === 'string') ? tryParse(dd.message) : tryParse(JSON.stringify(dd));
          if (!payload) return;
          if (payload.action === 'streamState') {
            const isLive = payload.live === true, was = streamLive;
            setLive(isLive);
            if (isLive && !was) startUptime(true);
            else if (!isLive && was) stopUptime();
            return;
          }
          if (payload.action === 'goalUpdate') {
            if (payload.celebrating === true || payload.celebrating === 'true') celebrate(+payload.current, +payload.newTarget, payload.lastUser);
            else if (!celebrating) updateGoal(+payload.current, +payload.target);
          }
          return;
        }
        function getUsername(data) {
          const candidates = [
            data?.user?.displayName, data?.user?.name, data?.user?.login, data?.displayName, data?.userName, data?.username,
            data?.login, data?.name, data?.user, data?.from_broadcaster_user_name, data?.from_broadcaster_user_login,
            data?.from_user_name, data?.from_user_login, data?.to_broadcaster_user_name, data?.raider?.displayName,
            data?.raider?.name, data?.raider_name, data?.gifter?.displayName, data?.gifter?.name, data?.gifter_name,
            data?.from_user?.displayName, data?.from_user?.name, data?.donor, data?.donation?.donor,
            data?.event?.user?.displayName, data?.event?.user?.name, data?.event?.user_name, data?.event?.user_login,
            data?.event?.displayName, data?.event?.username, data?.event?.from_broadcaster_user_name,
            data?.user_name, data?.user_login, data?.display_name, data?.redemption?.user?.displayName, data?.redemption?.user?.name,
            typeof data === 'string' ? data : null
          ];
          for (let c of candidates) if (c && typeof c === 'string' && c.trim() !== '') return c.trim();
          console.warn('No se pudo extraer nombre del evento:', data);
          return 'Alguien';
        }
        if (src === 'twitch') {
          const u = getUsername(dd);
          if (type === 'sub' && E.showSubs) pushEvent({ type: 'sub', user: u, extra: `se suscribió ${tierLbl(dd.subTier) || ''}` });
          if (type === 'resub' && E.showReSubs) pushEvent({ type: 'resub', user: u, extra: `renovó ${dd.cumulativeMonths || dd.months || 1} meses` });
          if (type === 'giftsub' && E.showGiftSubs) pushEvent({ type: 'giftsub', user: u, extra: `regaló sub a ${dd.recipient?.displayName || dd.recipientDisplayName || 'alguien'}` });
          if (type === 'giftbomb' && E.showGiftBombs) pushEvent({ type: 'giftbomb', user: u, extra: `regaló ${dd.gifts || dd.giftCount || 1} subs 🎁` });
          if (type === 'raid' && E.showRaids) pushEvent({ type: 'raid', user: u, extra: `con ${dd.viewers || dd.viewerCount || 0} espectadores` });
          if (type === 'cheer' && E.showCheers) pushEvent({ type: 'bits', user: u, extra: `donó ${dd.bits || dd.bitsAmount || 0} bits` });
          if (type === 'follow' && E.showFollows) pushEvent({ type: 'follow', user: u, extra: `comenzó a seguir` });
          if (type === 'rewardredemption' && E.showRedemptions) pushEvent({ type: 'redeem', user: u, extra: `canjeó "${dd.rewardTitle || dd.reward?.title || 'recompensa'}"` });
        }
        if (src === 'youtube') {
          const u = dd.user?.displayName || dd.displayName || 'Alguien';
          if ((type === 'newmember' || type === 'membermilestone') && E.showYTMembers) pushEvent({ type: 'member', user: u, extra: `se unió como miembro ${dd.tier || ''}` });
          if (type === 'superchat' && E.showSuperChat) pushEvent({ type: 'super', user: u, extra: `envió $${dd.amount || ''} en Super Chat` });
        }
        if (src === 'streamelements' && type === 'donation' && E.showDonations) {
          const u = dd.donor || dd.name || dd.username || 'Anónimo';
          pushEvent({ type: 'donate', user: u, extra: `donó $${dd.amount || ''}` });
        }
      };
      ws.onclose = () => {
        setLive(false);
        document.getElementById('tick-user').textContent = '⚠  Señal perdida — reconectando...';
        setTimeout(connect, 5000);
      };
      ws.onerror = () => ws.close();
    }

    // Inicialización
    window.addEventListener('load', () => {
      connect();
      const audio = document.getElementById('notification-sound');
      if (audio && audio.load) {
        audio.load();
      }
      setTimeout(() => {
        widgetEl.classList.add('ready');
        initTickerResizeObserver();
        adjustTickerFontSize();
      }, 300);
    });
    setTimeout(() => {
      if (document.getElementById('tick-inner')) {
        adjustTickerFontSize();
        initTickerResizeObserver();
      }
    }, 500);
  </script>
</body>

</html>
